<!--
Example: SDK events playground

This example demonstrates how to inspect DocSpace JavaScript SDK frame events in different modes.
Use it to initialize manager, viewer, file selector, or room selector and see the emitted events in real time.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />

    <meta name="example-title" content="SDK events playground" />
    <meta
      name="example-description"
      content="Initialize different SDK modes and inspect emitted events such as onAppReady, onContentReady, onSelectCallback, onNoAccess, and onAppError."
    />
    <meta name="example-group" content="advanced" />

    <title>SDK events playground</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.1.0/api.js"></script>

    <!-- App styles -->
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-sdk-events-playground">
    <div class="page">
      <div class="card">
        <h3 class="title">SDK events playground</h3>
        <p class="desc">
          Pick a mode, optionally provide a file ID, and inspect the events emitted by the SDK frame.
        </p>

        <div class="grid">
          <div>
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="manager">Manager</option>
              <option value="viewer">Viewer</option>
              <option value="file-selector">File selector</option>
              <option value="room-selector">Room selector</option>
            </select>
          </div>

          <div>
            <label for="fileId">File ID</label>
            <input id="fileId" type="text" placeholder="Required for viewer mode" autocomplete="off" />
          </div>

          <div>
            <label for="requestToken">requestToken</label>
            <input id="requestToken" type="text" placeholder="Optional share token" autocomplete="off" />
          </div>

          <div>
            <label for="downloadToEvent">downloadToEvent</label>
            <select id="downloadToEvent">
              <option value="false">false</option>
              <option value="true">true</option>
            </select>
          </div>
        </div>

        <div class="row">
          <button id="initBtn" type="button">Init frame</button>
          <button id="destroyBtn" type="button" class="btn-secondary">Destroy frame</button>
          <button id="clearBtn" type="button" class="btn-secondary">Clear log</button>
          <div class="hint" id="status">Ready</div>
        </div>

        <div class="result">
          <div class="result-title">Event log</div>
          <textarea id="log" readonly placeholder="SDK events will appear here..."></textarea>
        </div>
      </div>

      <div class="frame-wrap">
        <iframe id="ds-frame" class="frame" title="SDK events frame"></iframe>
      </div>
    </div>

    <script>
      const modeEl = document.getElementById("mode");
      const fileIdEl = document.getElementById("fileId");
      const requestTokenEl = document.getElementById("requestToken");
      const downloadToEventEl = document.getElementById("downloadToEvent");
      const initBtn = document.getElementById("initBtn");
      const destroyBtn = document.getElementById("destroyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");

      let instance = null;

      function setStatus(value) {
        statusEl.textContent = value;
      }

      function appendLog(eventName, payload) {
        const lines = [];
        lines.push("[" + new Date().toLocaleTimeString() + "] " + eventName);

        if (payload !== undefined) {
          try {
            lines.push(JSON.stringify(payload, null, 2));
          } catch {
            lines.push(String(payload));
          }
        }

        logEl.value = lines.join("\n") + "\n\n" + logEl.value;
      }

      function destroyFrame() {
        if (instance && typeof instance.destroyFrame === "function") {
          try {
            instance.destroyFrame();
          } catch {}
        }
        instance = null;
        setStatus("Destroyed");
      }

      function buildEvents() {
        return {
          onAppReady: (e) => {
            setStatus("App ready");
            appendLog("onAppReady", e || null);
          },
          onContentReady: (e) => {
            setStatus("Content ready");
            appendLog("onContentReady", e || null);
          },
          onAuthSuccess: (e) => {
            setStatus("Auth success");
            appendLog("onAuthSuccess", e || null);
          },
          onSelectCallback: (e) => {
            setStatus("Selected");
            appendLog("onSelectCallback", e || null);
          },
          onCloseCallback: (e) => {
            setStatus("Selector closed");
            appendLog("onCloseCallback", e || null);
          },
          onNoAccess: (e) => {
            setStatus("No access");
            appendLog("onNoAccess", e || null);
          },
          onNotFound: (e) => {
            setStatus("Not found");
            appendLog("onNotFound", e || null);
          },
          onDownload: (e) => {
            setStatus("Download event");
            appendLog("onDownload", e || null);
          },
          onEditorOpen: (e) => {
            setStatus("Editor opened");
            appendLog("onEditorOpen", e || null);
          },
          onFileManagerClick: (e) => {
            setStatus("File clicked");
            appendLog("onFileManagerClick", e || null);
          },
          onEditorCloseCallback: (e) => {
            setStatus("Editor close requested");
            appendLog("onEditorCloseCallback", e || null);
          },
          onSignOut: (e) => {
            setStatus("Signed out");
            appendLog("onSignOut", e || null);
          },
          onAppError: (e) => {
            setStatus("App error");
            appendLog("onAppError", e || null);
          }
        };
      }

      function initFrame() {
        const mode = modeEl.value;
        const fileId = String(fileIdEl.value || "").trim();
        const requestToken = String(requestTokenEl.value || "").trim() || undefined;
        const downloadToEvent = downloadToEventEl.value === "true";

        destroyFrame();
        setStatus("Initializing...");

        const commonConfig = {
          frameId: "ds-frame",
          width: "100%",
          height: "560px",
          theme: "base",
          requestToken,
          events: buildEvents()
        };

        if (mode === "manager") {
          instance = DocSpace.SDK.initManager({
            ...commonConfig,
            showHeader: true,
            showMenu: true,
            downloadToEvent
          });
          appendLog("initManager", { downloadToEvent, requestToken: requestToken || null });
          return;
        }

        if (mode === "viewer") {
          if (!fileId) {
            setStatus("File ID required");
            appendLog("validation", { error: "Provide file ID for viewer mode." });
            return;
          }

          instance = DocSpace.SDK.initViewer({
            ...commonConfig,
            id: fileId,
            showHeader: false,
            showTitle: true
          });
          appendLog("initViewer", { fileId, requestToken: requestToken || null });
          return;
        }

        if (mode === "file-selector") {
          instance = DocSpace.SDK.initFileSelector({
            ...commonConfig,
            showSelectorHeader: true,
            showSelectorCancel: true,
            withSearch: true,
            withBreadCrumbs: true
          });
          appendLog("initFileSelector", { requestToken: requestToken || null });
          return;
        }

        instance = DocSpace.SDK.initRoomSelector({
          ...commonConfig,
          showSelectorHeader: true,
          showSelectorCancel: true,
          withSearch: true
        });
        appendLog("initRoomSelector", { requestToken: requestToken || null });
      }

      initBtn.addEventListener("click", initFrame);
      destroyBtn.addEventListener("click", destroyFrame);
      clearBtn.addEventListener("click", () => {
        logEl.value = "";
        setStatus("Log cleared");
      });

      function syncModeOptions() {
        const isManager = modeEl.value === "manager";
        downloadToEventEl.disabled = !isManager;
        downloadToEventEl.closest("div").style.opacity = isManager ? "" : "0.4";
      }

      modeEl.addEventListener("change", syncModeOptions);
      syncModeOptions();
    </script>
  </body>
</html>
