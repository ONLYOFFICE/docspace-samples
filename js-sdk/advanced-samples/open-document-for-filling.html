<!--
Example: Open Document for Filling

Pick a file via the file selector, then open it in fill mode (action=fill)
or in normal editor mode — both embedded in the same frame.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Open Document for Filling" />
    <meta name="example-description" content="Select a document and open it in fill mode (for fillable PDFs) or in full editor mode — both shown side by side in the page." />
    <meta name="example-group" content="advanced" />
    <title>Open Document for Filling</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-open-document-for-filling">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button id="backBtn" type="button" class="btn btn--secondary" style="display:none">← Select another file</button>
          <span class="status" id="hint">Select a file to enable actions</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 340px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file</label>
          <input id="selectedTitle" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="openFill" type="button" class="btn" disabled>Fill form</button>
          <button id="openEdit" type="button" class="btn btn--secondary" disabled>Edit</button>
        </div>

        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:10px">
          <label>Selection payload</label>
          <textarea id="payload" readonly
            style="flex:1;resize:none;font-family:ui-monospace,monospace;font-size:12px"
            placeholder="Pick a file to see payload…"></textarea>
        </div>
      </div>
    </div>

    <script>
      const hint          = document.getElementById("hint");
      const selectedTitle = document.getElementById("selectedTitle");
      const openFill      = document.getElementById("openFill");
      const openEdit      = document.getElementById("openEdit");
      const payloadEl     = document.getElementById("payload");
      const backBtn       = document.getElementById("backBtn");

      let instance = null;
      let selected = null;

      function setHint(text) { hint.textContent = text; }

      function updateUI() {
        const ok = !!selected?.id;
        openFill.disabled = !ok;
        openEdit.disabled = !ok;
      }

      function destroyCurrent() {
        if (instance && typeof instance.destroyFrame === "function") {
          try { instance.destroyFrame(); } catch {}
        }
        instance = null;
      }

      function showSelector() {
        backBtn.style.display = "none";
      }

      function showEditor() {
        backBtn.style.display = "";
      }

      function openInFrame(action) {
        if (!selected?.id) return;
        showEditor();

        if (action === "fill") {
          // SDK does not expose a fill-mode config.
          // Navigate the existing SDK iframe directly — this preserves auth cookies
          // and frame dimensions. Do NOT call destroyFrame() first.
          setHint("Opening fill form…");
          instance = null; // drop reference without destroying

          const el = document.getElementById("ds-frame");
          const iframe = el?.tagName?.toLowerCase() === "iframe" ? el : el?.querySelector("iframe");
          if (!iframe) { setHint("Error: frame not found"); return; }

          const url = new URL("doceditor", document.baseURI);
          url.searchParams.set("fileId", String(selected.id));
          url.searchParams.set("action", "fill");
          iframe.onload = () => { setHint("Fill form ready"); iframe.onload = null; };
          iframe.src = url.toString();
        } else {
          destroyCurrent();
          setHint("Opening editor…");
          instance = DocSpace.SDK.initEditor({
            id: selected.id,
            frameId: "ds-frame",
            width: "700px",
            height: "520px",
            theme: "base",
            events: {
              onAppReady: () => setHint("Editor ready"),
              onAppError: () => setHint("Error")
            }
          });
        }
      }

      function openSelector() {
        document.getElementById("ds-frame").onload = null;
        destroyCurrent();
        showSelector();
        setHint("Select a file…");

        instance = DocSpace.SDK.initFileSelector({
          frameId: "ds-frame",
          width: "700px",
          height: "520px",
          theme: "base",
          events: {
            onSelectCallback: (data) => {
              const item = Array.isArray(data) ? data[0] : data;
              const id = item?.id ?? null;
              if (!id) return;
              selected = { id: String(id), title: item?.title || item?.name || `File ${id}` };
              selectedTitle.value = selected.title;
              payloadEl.value     = JSON.stringify(item, null, 2);
              setHint("Ready");
              updateUI();
            },
            onAppError: () => setHint("Selector error")
          }
        });
      }

      openFill.onclick = () => openInFrame("fill");
      openEdit.onclick = () => openInFrame("edit");
      backBtn.onclick  = openSelector;

      openSelector();
      updateUI();
    </script>
  </body>
</html>
