<!--
Example: React file selector example

This example demonstrates how to embed the DocSpace file selector in a React component and keep the selected file in React state.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="DocSpace in React" />
    <meta name="example-description" content="Embed the DocSpace file selector as a React component. Selected files update React state; the frame remounts automatically when config changes." />
    <meta name="example-group" content="advanced" />
    <title>DocSpace in React</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-react-manager-example">
    <div id="root"></div>

    <script>
      const h = React.createElement;
      const { useEffect, useRef, useState } = React;

      function stringify(value) {
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return String(value);
        }
      }

      function DocSpaceFileSelectorFrame(props) {
        const { requestToken, onStatusChange, onEvent, onSelection } = props;
        const instanceRef = useRef(null);
        const onStatusChangeRef = useRef(onStatusChange);
        const onEventRef = useRef(onEvent);
        const onSelectionRef = useRef(onSelection);
        const frameId = "react-file-selector-frame";

        useEffect(() => {
          onStatusChangeRef.current = onStatusChange;
          onEventRef.current = onEvent;
          onSelectionRef.current = onSelection;
        }, [onStatusChange, onEvent, onSelection]);

        useEffect(() => {
          if (!(window.DocSpace && window.DocSpace.SDK)) {
            onStatusChangeRef.current("SDK not loaded");
            return undefined;
          }

          onStatusChangeRef.current("Initializing selector...");

          instanceRef.current = DocSpace.SDK.initFileSelector({
            frameId,
            width: "700px",
            height: "520px",
            theme: "base",
            requestToken: requestToken || undefined,
            events: {
              onAppReady: (event) => {
                onStatusChangeRef.current("Selector ready");
                onEventRef.current("onAppReady", event || null);
              },
              onContentReady: (event) => {
                onStatusChangeRef.current("Content loaded");
                onEventRef.current("onContentReady", event || null);
              },
              onSelectCallback: (data) => {
                const item = Array.isArray(data) ? data[0] : data;
                onSelectionRef.current(item, data);
                onStatusChangeRef.current(item && item.id ? "File selected" : "Selection updated");
                onEventRef.current("onSelectCallback", data);
              },
              onCloseCallback: (event) => {
                onStatusChangeRef.current("Selector closed");
                onEventRef.current("onCloseCallback", event || null);
              },
              onAppError: (event) => {
                onStatusChangeRef.current("App error");
                onEventRef.current("onAppError", event || null);
              }
            }
          });

          return () => {
            if (instanceRef.current && typeof instanceRef.current.destroyFrame === "function") {
              try {
                instanceRef.current.destroyFrame();
              } catch {}
            }
            instanceRef.current = null;
          };
        }, [requestToken]);

        return h("iframe", { id: frameId, title: "React file selector frame" });
      }

      function App() {
        const [draftToken, setDraftToken] = useState("");
        const [appliedToken, setAppliedToken] = useState("");
        const [mounted, setMounted] = useState(true);
        const [status, setStatus] = useState("Ready");
        const [eventLog, setEventLog] = useState("");
        const [selectedFile, setSelectedFile] = useState(null);
        const [rawSelection, setRawSelection] = useState("");

        function appendEvent(name, payload) {
          const lines = ["[" + new Date().toLocaleTimeString() + "] " + name];
          if (payload !== undefined) lines.push(stringify(payload));
          setEventLog((current) => lines.join("\n") + "\n\n" + current);
        }

        function applyState() {
          setAppliedToken(String(draftToken || "").trim());
          setMounted(true);
          setStatus("Reinitializing...");
        }

        function handleSelection(item, rawEvent) {
          setSelectedFile(item);
          setRawSelection(stringify(rawEvent || null));
        }

        return h(
          "div",
          { className: "result-split" },
          h(
            "div",
            { className: "result-split__frame" },
            h(
              "div",
              { className: "frame-wrap" },
              mounted
                ? h(DocSpaceFileSelectorFrame, {
                    requestToken: appliedToken,
                    onStatusChange: setStatus,
                    onEvent: appendEvent,
                    onSelection: handleSelection
                  })
                : h("div", {
                    style: {
                      width: "700px",
                      height: "520px",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#6b7280",
                      fontSize: "14px",
                      background: "#f9fafb",
                      borderRadius: "12px"
                    }
                  }, "Frame is unmounted")
            ),
            h(
              "div",
              { className: "bottom-bar" },
              h(
                "button",
                {
                  type: "button",
                  className: "btn btn--secondary",
                  onClick: () => {
                    if (mounted) { setMounted(false); setStatus("Unmounted"); }
                    else         { setMounted(true);  setStatus("Mounting..."); }
                  }
                },
                mounted ? "Unmount frame" : "Mount frame"
              ),
              h("span", { className: "status" }, status)
            )
          ),
          h(
            "div",
            { className: "result-split__panel card", style: { flex: "0 0 360px", minHeight: "520px" } },
            h(
              "div",
              { className: "field", style: { flex: "0 0 auto" } },
              h("label", { htmlFor: "requestToken" }, "requestToken"),
              h("input", {
                id: "requestToken",
                type: "text",
                value: draftToken,
                placeholder: "Optional share token",
                autoComplete: "off",
                onChange: (e) => setDraftToken(e.target.value)
              })
            ),
            h(
              "div",
              { className: "actions", style: { flex: "0 0 auto", marginTop: "12px" } },
              h("button", { type: "button", className: "btn", onClick: applyState }, "Apply state")
            ),
            h(
              "div",
              { className: "field", style: { flex: "0 0 auto", marginTop: "10px" } },
              h("label", null, "Selected file"),
              h("input", {
                type: "text",
                readOnly: true,
                value: selectedFile
                  ? String(
                      selectedFile.title ||
                      selectedFile.name ||
                      selectedFile.fileTitle ||
                      selectedFile.fileName ||
                      "File " + selectedFile.id
                    )
                  : "",
                placeholder: "— select a file —"
              })
            ),
            h(
              "div",
              { className: "field", style: { flex: "1", display: "flex", flexDirection: "column", marginTop: "10px" } },
              h("label", null, "Raw selection"),
              h("textarea", {
                className: "output",
                readOnly: true,
                value: rawSelection,
                placeholder: "Raw onSelectCallback payload\u2026",
                style: { flex: "1", resize: "none", fontFamily: "ui-monospace,monospace", fontSize: "12px" }
              })
            ),
            h(
              "div",
              { className: "field", style: { flex: "1", display: "flex", flexDirection: "column", marginTop: "10px" } },
              h("label", null, "Event log"),
              h("textarea", {
                className: "output",
                readOnly: true,
                value: eventLog,
                placeholder: "SDK events will appear here\u2026",
                style: { flex: "1", resize: "none", fontFamily: "ui-monospace,monospace", fontSize: "12px" }
              })
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
