<!--
Example: Create a PDF form template from scratch

Flow:
1) Pick a room.
2) Enter a file name (must end with .pdf).
3) Provide a JSON array of fields to insert (each field gets a FormKey).
4) Click "Create template" to create a new PDF and insert form fields via executeInEditor.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createFile (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createfile)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />

    <meta name="example-title" content="Create PDF Form Template" />
    <meta name="example-description" content="Create a new fillable PDF, add form fields with custom FormKeys via the editor API, and save the result as a reusable template." />
    <meta name="example-group" content="advanced" />

    <title>Create PDF Form Template</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>

    <!-- App styles -->
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-create-pdf-form-template">
    <div class="page ex-create-pdf-form-template__layout">
      <div class="ex-create-pdf-form-template__left">
        <div class="frame-wrap">
          <iframe id="ds-destination-picker"></iframe>
        </div>

        <div class="bottom-bar">
          <input id="fileName" type="text" value="New_Form_Template.pdf" autocomplete="off" />
          <button id="create" type="button" class="btn" disabled>Create template</button>
          <span class="status" id="hint">Select a room</span>
        </div>
      </div>

      <div class="card ex-create-pdf-form-template__side">
        <div class="ex-create-pdf-form-template__meta">
          <div class="ex-create-pdf-form-template__kv">
            <div class="ex-create-pdf-form-template__k">Selected roomId</div>
            <div class="ex-create-pdf-form-template__v" id="destFolderId">None</div>
          </div>
          <div class="ex-create-pdf-form-template__kv">
            <div class="ex-create-pdf-form-template__k">Manager</div>
            <div class="ex-create-pdf-form-template__v" id="managerState">Loading...</div>
          </div>
        </div>

        <div class="field">
          <label for="fields">Fields (JSON array)</label>
          <textarea id="fields" placeholder='[{"type":"text","label":"First name","key":"FirstName"}]'></textarea>
          <div class="ex-create-pdf-form-template__muted">
            Supported types: <code>text</code>, <code>checkbox</code>, <code>date</code>, <code>picture</code>.
            Each field should have <code>key</code> (this becomes <b>FormKey</b>).
          </div>
        </div>

        <div class="field ex-create-pdf-form-template__log-field">
          <label for="log">Log</label>
          <textarea id="log" class="output" readonly placeholder="Progress log..."></textarea>
        </div>
      </div>
    </div>

    <!-- Hidden manager frame for executing SDK methods -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-manager-frame"></div>
    </div>
    <iframe id="ds-hidden-editor" class="hidden-frame" title="Editor frame"></iframe>

    <script>
      const destFolderIdEl = document.getElementById("destFolderId");
      const managerStateEl = document.getElementById("managerState");
      const fileNameEl = document.getElementById("fileName");
      const fieldsEl = document.getElementById("fields");
      const createBtn = document.getElementById("create");
      const hintEl = document.getElementById("hint");
      const logEl = document.getElementById("log");

      let manager = null;
      let picker = null;
      let editorInstance = null;
      let managerReady = false;
      let destFolderId = "";

      function extractId(data) {
        if (!data || typeof data !== "object") return "";
        if (Array.isArray(data)) {
          const first = data[0];
          return first?.id ? String(first.id).trim() : "";
        }
        if (data.id != null && String(data.id).trim()) return String(data.id).trim();
        if (Array.isArray(data.items) && data.items[0]?.id != null) return String(data.items[0].id).trim();
        if (data.item?.id != null) return String(data.item.id).trim();
        if (data.selected?.id != null) return String(data.selected.id).trim();
        return "";
      }

      function setHint(text) {
        hintEl.textContent = String(text ?? "");
      }

      function logLine(text) {
        const line = String(text ?? "");
        logEl.value = (logEl.value ? logEl.value + "\n" : "") + line;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function destroyEditor() {
        if (editorInstance && typeof editorInstance.destroyFrame === "function") {
          try {
            editorInstance.destroyFrame();
          } catch {}
        }
        editorInstance = null;
      }

      function updateUi() {
        destFolderIdEl.textContent = destFolderId || "None";
        createBtn.disabled = !managerReady || !destFolderId || !String(fileNameEl.value || "").trim().toLowerCase().endsWith(".pdf");
      }

      function getCreatedFileId(res) {
        const id = res?.id ?? "";
        return id ? String(id).trim() : "";
      }

      function parseFields() {
        const raw = String(fieldsEl.value || "").trim();
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error("Fields must be a JSON array");
        return parsed;
      }

      function buildCreatePdfFormCommand(fields) {
        const payload = JSON.stringify(fields || []);

        return new Function(
          "editorInstance",
          `
            try {
              const connector = editorInstance?.createConnector?.();
              if (!connector?.callCommand) {
                console.error("connector.callCommand is not available", connector);
                return;
              }

              Asc.scope.fields = ${payload};

              connector.callCommand(function () {
                try {
                  const doc = Api.GetDocument && Api.GetDocument();
                  if (!doc) {
                    console.error("Api.GetDocument is not available");
                    return;
                  }

                  const fields = Asc.scope.fields || [];

                  function addLabel(p, text) {
                    if (text) p.AddText(String(text) + " ");
                  }

                  for (let i = 0; i < fields.length; i += 1) {
                    const field = fields[i] || {};
                    const type = String(field.type || "text");
                    const key = String(field.key || "").trim();
                    const label = String(field.label || "").trim();
                    const placeholder = String(field.placeholder || "").trim();
                    const required = !!field.required;

                    if (!key) {
                      console.warn("Skip field without key", field);
                      continue;
                    }

                    const p = Api.CreateParagraph();
                    addLabel(p, label);

                    let form = null;
                    if (type === "checkbox") {
                      form = Api.CreateCheckBoxForm({ key, required: required || false, radio: false, tip: placeholder || "" });
                    } else if (type === "date") {
                      form = Api.CreateDateForm({ key, required: required || false, placeholder: placeholder || "" });
                    } else if (type === "picture") {
                      form = Api.CreatePictureForm({ key, required: required || false, placeholder: placeholder || "" });
                    } else {
                      form = Api.CreateTextForm({
                        key,
                        required: required || false,
                        placeholder: placeholder || "",
                        comb: !!field.comb,
                        maxCharacters: field.maxCharacters ? Number(field.maxCharacters) : undefined,
                        multiLine: !!field.multiLine,
                        autoFit: true
                      });
                    }

                    if (form && p && typeof p.AddElement === "function") p.AddElement(form);
                    doc.Push(p);
                  }

                  Api.Save();
                } catch (error) {
                  console.error("Failed to build PDF form", error);
                }
              });
            } catch (error) {
              console.error("Failed to build command", error);
            }
          `
        );
      }

      async function openHiddenEditorAndRun(fileId, fields) {
        return new Promise((resolve, reject) => {
          destroyEditor();

          editorInstance = DocSpace.SDK.initEditor({
            id: String(fileId),
            frameId: "ds-hidden-editor",
            width: "1px",
            height: "1px",
            theme: "base",
            events: {
              onAppReady: () => {
                const frame = DocSpace?.SDK?.frames?.["ds-hidden-editor"];
                if (!frame || typeof frame.executeInEditor !== "function") {
                  reject(new Error("executeInEditor not available"));
                  destroyEditor();
                  return;
                }

                try {
                  frame.executeInEditor(buildCreatePdfFormCommand(fields));
                } catch (error) {
                  reject(error);
                  destroyEditor();
                  return;
                }

                setTimeout(() => {
                  destroyEditor();
                  resolve();
                }, 7000);
              },
              onAppError: (e) => {
                destroyEditor();
                reject(e || new Error("Editor error"));
              }
            }
          });
        });
      }

      function initHiddenManager() {
        managerReady = false;
        managerStateEl.textContent = "Loading...";

        manager = DocSpace.SDK.initManager({
          frameId: "ds-manager-frame",
          width: "0",
          height: "0",
          theme: "base",
          events: {
            onAppReady: () => {
              managerReady = true;
              managerStateEl.textContent = "Ready";
              updateUi();
            },
            onAppError: () => {
              managerReady = false;
              managerStateEl.textContent = "Error";
              setHint("Manager error");
              updateUi();
            }
          }
        });
      }

      function initDestinationPicker() {
        picker = DocSpace.SDK.initRoomSelector({
          frameId: "ds-destination-picker",
          width: "960px",
          height: "600px",
          theme: "base",
          events: {
            onSelectCallback: (selection) => {
              const id = extractId(selection);
              if (!id) return;
              destFolderId = id;
              setHint("Room selected");
              updateUi();
            },
            onAppError: () => {
              setHint("Selector error");
            }
          }
        });
      }

      fileNameEl.addEventListener("input", updateUi);

      createBtn.onclick = async () => {
        logLine("---");
        logLine("Run: " + new Date().toISOString());

        const fileName = String(fileNameEl.value || "").trim();
        if (!fileName.toLowerCase().endsWith(".pdf")) {
          setHint("File name must end with .pdf");
          return;
        }
        if (!destFolderId) {
          setHint("Select a room");
          return;
        }

        let fields = [];
        try {
          fields = parseFields();
        } catch (error) {
          setHint("Invalid JSON");
          logLine("ERROR: " + String(error?.message || error));
          return;
        }

        setHint("Creating .pdf...");
        createBtn.disabled = true;
        try {
          const createdFile = await manager.createFile(String(destFolderId), fileName);
          const createdId = getCreatedFileId(createdFile);
          if (!createdId) throw new Error("Created file id not found in response");
          logLine("Created: " + fileName + " (" + createdId + ")");

          setHint("Inserting fields...");
          await openHiddenEditorAndRun(createdId, fields);
          logLine("OK");
          setHint("Done");
        } catch (error) {
          logLine("ERROR: " + String(error?.message || error));
          setHint("Error");
        } finally {
          updateUi();
        }
      };

      fieldsEl.value = JSON.stringify(
        [
          { type: "text", label: "First name", key: "FirstName", placeholder: "Enter first name", required: true },
          { type: "text", label: "Last name", key: "LastName", placeholder: "Enter last name", required: true },
          { type: "checkbox", label: "Agree", key: "Agree" },
          { type: "date", label: "Birth date", key: "BirthDate", placeholder: "YYYY-MM-DD" }
        ],
        null,
        2
      );

      initHiddenManager();
      initDestinationPicker();
      updateUi();
    </script>
  </body>
</html>
