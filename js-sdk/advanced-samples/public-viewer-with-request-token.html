<!--
Example: Public viewer with request token

Pick a file via the file selector, create a public link via backend,
and open the embedded viewer using the returned requestToken.

Prerequisites:
- Start local backend from `js-sdk` so `/api/create-public-share-link` is available.
- Set `PORTAL_SRC` and `ADMIN_API_KEY` in `js-sdk/.env`.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Public Viewer with Request Token" />
    <meta name="example-description" content="Select a file, generate a public share link via the backend, and embed it in a read-only viewer using a request token for secure access." />
    <meta name="example-group" content="advanced" />
    <title>Public Viewer with Request Token</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-public-viewer-with-request-token">
    <div class="result-split">
      <div class="result-split__frame">
        <!-- Step 1: file selector -->
        <div class="frame-wrap" id="selectorWrap">
          <iframe id="selector-frame"></iframe>
        </div>
        <!-- Step 2: viewer shown after Open -->
        <div class="frame-wrap" id="viewerWrap" style="display:none">
          <iframe id="viewer-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button id="backBtn" class="btn btn--secondary" type="button" style="display:none">← Select another file</button>
          <span class="status" id="hint">Select a file</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 320px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file</label>
          <input id="selectedTitle" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label for="requestTokenOverride">requestToken <span style="color:#9ca3af;font-weight:400">(optional override)</span></label>
          <input id="requestTokenOverride" type="text" placeholder="Paste token to override" autocomplete="off" />
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button class="btn" id="openBtn" type="button" disabled>Create link &amp; Open</button>
          <span class="status" id="actionStatus"></span>
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label>Share link</label>
          <input id="shareLink" type="text" readonly placeholder="— will appear after creation —"
            style="font-family:ui-monospace,monospace;font-size:12px" />
        </div>
      </div>
    </div>

    <script>
      const hint                   = document.getElementById("hint");
      const selectedTitle          = document.getElementById("selectedTitle");
      const requestTokenOverrideEl = document.getElementById("requestTokenOverride");
      const openBtn                = document.getElementById("openBtn");
      const actionStatus           = document.getElementById("actionStatus");
      const shareLinkEl            = document.getElementById("shareLink");
      const selectorWrap           = document.getElementById("selectorWrap");
      const viewerWrap             = document.getElementById("viewerWrap");
      const backBtn                = document.getElementById("backBtn");

      let viewerInstance = null;
      let selected = null;

      function setHint(text)   { hint.textContent = text; }
      function setStatus(text) { actionStatus.textContent = text; }

      function showSelector() {
        selectorWrap.style.display = "";
        viewerWrap.style.display   = "none";
        backBtn.style.display      = "none";
      }

      function showViewer() {
        selectorWrap.style.display = "none";
        viewerWrap.style.display   = "";
        backBtn.style.display      = "";
      }

      function destroyViewer() {
        if (viewerInstance && typeof viewerInstance.destroyFrame === "function") {
          try { viewerInstance.destroyFrame(); } catch {}
        }
        viewerInstance = null;
      }

      // File selector
      DocSpace.SDK.initFileSelector({
        frameId: "selector-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            if (!item?.id) return;
            selected = { id: String(item.id), title: item?.title || item?.name || `File ${item.id}` };
            selectedTitle.value = selected.title;
            openBtn.disabled = false;
            setHint(`Selected: ${selected.title}`);
            setStatus("");
          },
          onAppError: () => setHint("Selector error")
        }
      });

      backBtn.onclick = () => {
        destroyViewer();
        showSelector();
        setHint(selected ? `Selected: ${selected.title}` : "Select a file");
        setStatus("");
      };

      openBtn.addEventListener("click", async () => {
        if (!selected?.id) return;

        openBtn.disabled = true;
        shareLinkEl.value = "";
        setStatus("Creating public link…");
        showViewer();
        setHint("Creating link…");

        try {
          const res = await fetch(window.location.origin + "/api/create-public-share-link", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ fileId: selected.id })
          });
          const json = await res.json().catch(() => null);
          if (!res.ok) throw new Error(json?.details || json?.error || "HTTP " + res.status);

          const shareLink    = String(json?.shareLink    || "").trim();
          const requestToken = String(requestTokenOverrideEl.value || "").trim()
                            || String(json?.requestToken || "").trim();
          const resolvedId   = String(json?.fileId || selected.id).trim();

          if (!shareLink)    throw new Error("shareLink missing in response");
          if (!requestToken) throw new Error("requestToken missing in response");

          shareLinkEl.value = shareLink;
          setStatus("Opening viewer…");
          setHint("Loading viewer…");

          destroyViewer();
          viewerInstance = DocSpace.SDK.initViewer({
            frameId: "viewer-frame",
            id: resolvedId,
            requestToken,
            width: "700px",
            height: "520px",
            theme: "base",
            showHeader: false,
            showTitle: true,
            events: {
              onAppReady:     () => { setStatus("Viewer ready"); setHint("Viewer ready"); },
              onContentReady: () => { setStatus("Content loaded"); setHint("Content loaded"); },
              onNoAccess:     () => { setStatus("No access");     setHint("No access"); },
              onNotFound:     () => { setStatus("Not found");     setHint("Not found"); },
              onAppError:     () => { setStatus("Viewer error");  setHint("Error"); }
            }
          });
        } catch (error) {
          setStatus("Error: " + (error?.message || String(error)));
          setHint("Error");
          showSelector();
        } finally {
          openBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
