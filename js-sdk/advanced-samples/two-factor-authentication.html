<!--
Example: Two-factor authentication

This example demonstrates a two-step verification process using a phone number and 4-digit code before granting access to DocSpace via the SDK.
Once verified, the form is replaced by a file management interface embedded in an iframe.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="example-title" content="Two-Factor Authentication" />
    <meta name="example-description" content="Simulate two-factor authentication: enter a phone number to receive a code, verify it, and unlock the embedded DocSpace manager." />
    <meta name="example-group" content="advanced" />
    <title>Two-Factor Authentication</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-two-factor-authentication">

    <!-- Phase 1: verification form, centered -->
    <div id="formPhase" class="ex-2fa-form-phase">
      <div class="card ex-2fa-card">
        <div class="field">
          <label for="inputPhone">Phone number</label>
          <div class="ex-2fa-row">
            <input type="tel" id="inputPhone" placeholder="+1 555 000 0000" />
            <button id="btnPhone" type="button" class="btn">Generate code</button>
          </div>
        </div>
        <div class="field">
          <label for="inputCode">Verification code</label>
          <div class="ex-2fa-row">
            <input type="text" id="inputCode" placeholder="4-digit code" maxlength="4" />
            <button id="btnCode" type="button" class="btn" disabled>Verify</button>
          </div>
        </div>
        <span class="status" id="hint">Enter a phone number to generate a code.</span>
      </div>
    </div>

    <!-- Phase 2: full-page manager, shown after verification -->
    <div id="managerPhase" class="ex-2fa-manager-phase" style="display:none">
      <div class="frame-wrap">
        <iframe id="ds-frame" title="DocSpace"></iframe>
      </div>
      <div class="bottom-bar">
        <span class="status" id="managerStatus">Opening DocSpace…</span>
      </div>
    </div>

    <script>
      const elPhone       = document.getElementById("inputPhone");
      const elBtnPhone    = document.getElementById("btnPhone");
      const elCode        = document.getElementById("inputCode");
      const elBtnCode     = document.getElementById("btnCode");
      const hint          = document.getElementById("hint");
      const formPhase     = document.getElementById("formPhase");
      const managerPhase  = document.getElementById("managerPhase");
      const managerStatus = document.getElementById("managerStatus");

      let generatedCode = "";
      let managerInited = false;

      function setHint(text) { hint.textContent = text; }

      function updateVerifyState() {
        elBtnCode.disabled = !generatedCode || elCode.value.trim().length !== 4;
      }

      elPhone.addEventListener("input", () => {
        setHint(elPhone.value.trim() ? 'Click "Generate code".' : "Enter a phone number to generate a code.");
      });

      elCode.addEventListener("input", updateVerifyState);

      elBtnPhone.addEventListener("click", () => {
        const phone = elPhone.value.trim();
        if (!phone) { setHint("Enter a phone number first."); elPhone.focus(); return; }

        generatedCode = String(Math.floor(1000 + Math.random() * 9000));
        setHint('Code sent (demo): ' + generatedCode + ' — enter it below and click "Verify".');
        elCode.focus();
        updateVerifyState();
      });

      elBtnCode.addEventListener("click", () => {
        if (!generatedCode) { setHint("Generate a code first."); return; }

        if (elCode.value.trim() !== generatedCode) {
          setHint("Invalid code. Try again.");
          elCode.focus();
          return;
        }

        if (managerInited) return;
        managerInited = true;

        // Switch to manager phase
        formPhase.style.display    = "none";
        managerPhase.style.display = "";

        DocSpace.SDK.initManager({
          frameId: "ds-frame",
          width:   "100%",
          height:  "100%",
          theme:   "base",
          events: {
            onAppReady:    () => { managerStatus.textContent = "Ready"; },
            onAppError:    () => { managerStatus.textContent = "Manager error"; }
          }
        });
      });

      updateVerifyState();
    </script>
  </body>
</html>
