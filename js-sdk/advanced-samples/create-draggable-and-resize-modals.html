<!--
Example: Create draggable and resizable DocSpace modals

This example demonstrates how to embed multiple DocSpace "System" instances into draggable and resizable modal windows.
Each modal is an independent SDK frame. You can open/close windows, bring them to front, drag by the header, and resize
from the bottom-right corner.

Using methods:
- DocSpace.SDK.initSystem (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initsystem)
- system.login (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#login)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />

    <meta name="example-title" content="Draggable and Resizable Modals" />
    <meta name="example-description" content="Open DocSpace in floating modal windows that you can drag and resize. Each modal is an independent SDK instance with auto-login." />
    <meta name="example-group" content="advanced" />

    <title>Draggable and Resizable Modals</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>

    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-draggable-resize-modals">
    <div class="page">
      <div class="card">
        <div class="title">DocSpace modals</div>

        <div class="grid">
          <div class="field">
            <label for="login">User email</label>
            <input id="login" type="text" placeholder="user@example.com" autocomplete="off" />
          </div>
          <div class="field">
            <label for="passwordHash">Password hash</label>
            <input id="passwordHash" type="text" placeholder="PASTE_HASH_HERE" autocomplete="off" />
          </div>
        </div>

        <div class="row">
          <button id="newWin" type="button" class="btn" disabled>New window</button>
          <span class="status" id="status">Preparing SDK...</span>
        </div>
      </div>
    </div>

    <div id="desktop" class="desktop" aria-label="Desktop"></div>

    <template id="modalTemplate">
      <div class="ds-modal" role="dialog" aria-modal="false">
        <div class="ds-modal__header" data-role="drag">
          <div class="ds-modal__title"></div>
          <div class="ds-modal__meta"></div>
          <button class="ds-modal__close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="ds-modal__body">
          <iframe class="ds-modal__frame" allow="clipboard-read; clipboard-write; microphone; camera"></iframe>
        </div>
        <div class="ds-modal__resize" title="Resize" data-role="resize"></div>
      </div>
    </template>

    <script>
      const desktop = document.getElementById("desktop");
      const template = document.getElementById("modalTemplate");

      const loginEl = document.getElementById("login");
      const passwordHashEl = document.getElementById("passwordHash");
      const newWinBtn = document.getElementById("newWin");
      const statusEl = document.getElementById("status");

      (function () {
        const s = window.__demoConfig?.session;
        if (s?.user?.email) loginEl.value = String(s.user.email);
      })();

      const MIN_W = 360;
      const MIN_H = 240;

      let nextZ = 10;
      let winSeq = 0;
      let sdkReady = false;
      let interaction = null;
      let reloginTimer = null;
      const wins = new Map();

      function canAutoLogin() {
        return Boolean((loginEl.value || "").trim()) && Boolean((passwordHashEl.value || "").trim());
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function updateControls() {
        newWinBtn.disabled = !sdkReady;
      }

      function bringToFront(winEl) {
        nextZ += 1;
        winEl.style.zIndex = String(nextZ);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function normalizeRect(rect) {
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const left = clamp(rect.left, 0, Math.max(0, vw - rect.width));
        const top = clamp(rect.top, 0, Math.max(0, vh - rect.height));
        return { left, top, width: rect.width, height: rect.height };
      }

      async function tryLogin(winId) {
        const w = wins.get(winId);
        if (!w) return;
        if (!canAutoLogin()) {
          w.meta.textContent = "No credentials";
          return;
        }

        const login = (loginEl.value || "").trim();
        const passwordHash = (passwordHashEl.value || "").trim();

        w.meta.textContent = "Logging in...";

        try {
          await w.system.login(login, passwordHash);
          w.loggedIn = true;
          w.meta.textContent = "Logged in";
        } catch (error) {
          w.loggedIn = false;
          w.meta.textContent = "Login failed";
        }
      }

      function scheduleRelogin() {
        updateControls();
        if (!canAutoLogin()) return;
        clearTimeout(reloginTimer);
        reloginTimer = setTimeout(() => {
          for (const id of wins.keys()) tryLogin(id);
        }, 250);
      }

      function closeWin(winId) {
        const w = wins.get(winId);
        if (!w) return;

        try {
          if (w.system && typeof w.system.destroyFrame === "function") w.system.destroyFrame();
        } catch {}

        w.el.remove();
        wins.delete(winId);
        updateControls();
      }

      function applyRect(winId) {
        const w = wins.get(winId);
        if (!w) return;
        const rect = normalizeRect({ left: w.pos.left, top: w.pos.top, width: w.size.width, height: w.size.height });
        w.pos.left = rect.left;
        w.pos.top = rect.top;
        w.size.width = rect.width;
        w.size.height = rect.height;
        w.el.style.left = rect.left + "px";
        w.el.style.top = rect.top + "px";
        w.el.style.width = rect.width + "px";
        w.el.style.height = rect.height + "px";
      }

      function createWin() {
        winSeq += 1;
        const winId = "win-" + Date.now().toString(36) + "-" + winSeq;
        const frameId = "ds-frame-" + winId;

        const frag = template.content.cloneNode(true);
        const el = frag.querySelector(".ds-modal");
        const title = frag.querySelector(".ds-modal__title");
        const meta = frag.querySelector(".ds-modal__meta");
        const close = frag.querySelector(".ds-modal__close");
        const header = frag.querySelector(".ds-modal__header");
        const resize = frag.querySelector(".ds-modal__resize");
        const iframe = frag.querySelector(".ds-modal__frame");

        title.textContent = "DocSpace #" + winSeq;
        meta.textContent = "Loading...";
        iframe.id = frameId;
        el.dataset.id = winId;
        bringToFront(el);

        const panelRect = document.querySelector(".page .card")?.getBoundingClientRect();
        const viewWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const preferredTop = Math.max(panelRect ? Math.round(panelRect.bottom + 20) : 10, 400);
        const centeredLeft = Math.max(24, Math.round((viewWidth - 560) / 2));
        const offset = (wins.size % 5) * 24;
        const baseLeft = centeredLeft + offset;
        const baseTop = preferredTop + offset;

        wins.set(winId, {
          el,
          title,
          meta,
          frameId,
          system: null,
          loggedIn: false,
          pos: { left: baseLeft, top: baseTop },
          size: { width: 560, height: 420 }
        });

        desktop.appendChild(frag);
        applyRect(winId);

        el.addEventListener("pointerdown", () => bringToFront(el));

        close.addEventListener("click", (e) => {
          e.stopPropagation();
          closeWin(winId);
        });

        header.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          bringToFront(el);

          const w = wins.get(winId);
          interaction = {
            id: winId,
            type: "drag",
            startX: e.clientX,
            startY: e.clientY,
            startLeft: w.pos.left,
            startTop: w.pos.top,
            startW: w.size.width,
            startH: w.size.height
          };
          header.setPointerCapture(e.pointerId);
        });

        resize.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          bringToFront(el);

          const w = wins.get(winId);
          interaction = {
            id: winId,
            type: "resize",
            startX: e.clientX,
            startY: e.clientY,
            startLeft: w.pos.left,
            startTop: w.pos.top,
            startW: w.size.width,
            startH: w.size.height
          };
          resize.setPointerCapture(e.pointerId);
        });

        return winId;
      }

      function onPointerMove(e) {
        if (!interaction) return;
        const w = wins.get(interaction.id);
        if (!w) return;

        const dx = e.clientX - interaction.startX;
        const dy = e.clientY - interaction.startY;

        if (interaction.type === "drag") {
          w.pos.left = interaction.startLeft + dx;
          w.pos.top = interaction.startTop + dy;
          applyRect(interaction.id);
        } else if (interaction.type === "resize") {
          w.size.width = Math.max(MIN_W, interaction.startW + dx);
          w.size.height = Math.max(MIN_H, interaction.startH + dy);
          applyRect(interaction.id);
        }
      }

      function onPointerUp() {
        interaction = null;
      }

      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);

      function mountSystem(winId) {
        const w = wins.get(winId);
        if (!w) return;

        w.system = DocSpace.SDK.initSystem({
          frameId: w.frameId,
          width: "100%",
          height: "100%",
          theme: "base",
          events: {
            onAppReady: async () => {
              w.meta.textContent = "Ready";
              await tryLogin(winId);
            },
            onAppError: () => {
              w.meta.textContent = "SDK error — check portal URL";
            }
          }
        });
      }

      function openNewWindow() {
        const winId = createWin();
        mountSystem(winId);
        updateControls();
      }

      function ensureSdkLoaded() {
        return Boolean(window.DocSpace && window.DocSpace.SDK);
      }

      newWinBtn.addEventListener("click", openNewWindow);
      loginEl.addEventListener("input", scheduleRelogin);
      passwordHashEl.addEventListener("input", scheduleRelogin);

      if (ensureSdkLoaded()) {
        sdkReady = true;
        setStatus("SDK ready.");
        openNewWindow();
      } else {
        sdkReady = false;
        setStatus("SDK not found. Check PORTAL_SRC / access.");
      }

      updateControls();
    </script>
  </body>
</html>
