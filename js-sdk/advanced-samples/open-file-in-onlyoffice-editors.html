<!--
Example: Open file in ONLYOFFICE editors

Select a file in the file selector and open it in ONLYOFFICE editors.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Open File in ONLYOFFICE Editors" />
    <meta name="example-description" content="Select a file from the DocSpace manager and open it in the matching ONLYOFFICE editor: Writer for .docx, Spreadsheet for .xlsx, Presentation for .pptx." />
    <meta name="example-group" content="advanced" />
    <title>Open File in ONLYOFFICE Editors</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-open-file-in-onlyoffice-editors">
    <div class="frame-wrap">
      <iframe id="ds-frame"></iframe>
    </div>

    <div class="bottom-bar">
      <button id="backBtn" class="btn btn--secondary" type="button" style="display:none">← Select another file</button>
      <span class="status" id="hint">Select a file to open it</span>
    </div>

    <script>
      const hint    = document.getElementById("hint");
      const backBtn = document.getElementById("backBtn");

      let instance = null;

      function destroyCurrent() {
        if (instance && typeof instance.destroyFrame === "function") {
          try { instance.destroyFrame(); } catch {}
        }
        instance = null;
      }

      function openSelector() {
        destroyCurrent();
        backBtn.style.display = "none";
        hint.textContent = "Select a file…";

        instance = DocSpace.SDK.initFileSelector({
          frameId: "ds-frame",
          width: "900px",
          height: "520px",
          theme: "base",
          events: {
            onSelectCallback: (data) => {
              const item = Array.isArray(data) ? data[0] : data;
              if (!item?.id) return;
              openEditor(String(item.id));
            },
            onAppError: () => { hint.textContent = "Selector error"; }
          }
        });
      }

      function openEditor(fileId) {
        destroyCurrent();
        backBtn.style.display = "";
        hint.textContent = "Opening…";

        instance = DocSpace.SDK.initEditor({
          id: fileId,
          frameId: "ds-frame",
          width: "900px",
          height: "520px",
          theme: "base",
          events: {
            onAppReady: () => { hint.textContent = "Ready"; },
            onAppError: () => { hint.textContent = "Error"; }
          }
        });
      }

      backBtn.onclick = openSelector;

      openSelector();
    </script>
  </body>
</html>
