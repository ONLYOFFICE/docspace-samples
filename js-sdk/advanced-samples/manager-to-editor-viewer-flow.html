<!--
Example: File selector to editor/viewer flow

This example demonstrates how to select a file in the file selector and open the selected file in a viewer or editor frame.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="File selector to editor/viewer flow" />
    <meta
      name="example-description"
      content="Select a file in the file selector and open it in a viewer or editor frame."
    />
    <meta name="example-group" content="advanced" />
    <title>File selector to editor/viewer flow</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.1.0/api.js"></script>
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-manager-to-editor-viewer-flow">
    <div class="page">
      <div class="card">
        <div class="field">
          <label for="mode">Open mode</label>
          <select id="mode">
            <option value="viewer">Viewer</option>
            <option value="editor">Editor</option>
          </select>
        </div>
        <div class="actions">
          <span class="status" id="selectorStatus">Selector: initializing...</span>
          <span class="status" id="previewStatus">Preview: waiting for file selection</span>
        </div>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">File selector</span>
            <span class="panel-hint">Select a file inside DocSpace.</span>
          </div>
          <iframe id="selector-frame"></iframe>
        </section>

        <section class="panel">
          <div class="panel-header">
            <span class="panel-title">Viewer / Editor</span>
            <span class="panel-hint" id="selectionHint">No file selected</span>
          </div>
          <iframe id="preview-frame"></iframe>
        </section>
      </div>
    </div>

    <script>
      const modeEl = document.getElementById("mode");
      const selectorStatusEl = document.getElementById("selectorStatus");
      const previewStatusEl = document.getElementById("previewStatus");
      const selectionHintEl = document.getElementById("selectionHint");

      let selectorInstance = null;
      let previewInstance = null;
      let selectedFileId = "";
      let selectedFileTitle = "";

      function setSelectorStatus(value) {
        selectorStatusEl.textContent = "Selector: " + value;
      }

      function setPreviewStatus(value) {
        previewStatusEl.textContent = "Preview: " + value;
      }

      function setSelectionHint(value) {
        selectionHintEl.textContent = value;
      }

      function stringify(value) {
        try {
          return JSON.stringify(value, null, 2);
        } catch {
          return String(value);
        }
      }

      function firstObjectWithId(value) {
        if (!value) return null;

        if (Array.isArray(value)) {
          for (const item of value) {
            const found = firstObjectWithId(item);
            if (found) return found;
          }
          return null;
        }

        if (typeof value !== "object") return null;
        if (value.id !== undefined && value.id !== null) return value;

        for (const key of Object.keys(value)) {
          const found = firstObjectWithId(value[key]);
          if (found) return found;
        }

        return null;
      }

      function destroyInstance(instance) {
        if (!instance || typeof instance.destroyFrame !== "function") return;
        try {
          instance.destroyFrame();
        } catch {}
      }

      function resetPreview() {
        destroyInstance(previewInstance);
        previewInstance = null;
        selectedFileId = "";
        selectedFileTitle = "";
        setSelectionHint("No file selected");
        setPreviewStatus("waiting for file selection");
      }

      function openSelectedFile(fileId, title) {
        const mode = modeEl.value;

        destroyInstance(previewInstance);
        previewInstance = null;
        selectedFileId = String(fileId);
        selectedFileTitle = String(title || "");

        setSelectionHint(selectedFileTitle ? selectedFileTitle + " (ID: " + selectedFileId + ")" : "ID: " + selectedFileId);
        setPreviewStatus("opening " + mode + "...");

        const commonConfig = {
          frameId: "preview-frame",
          id: selectedFileId,
          width: "100%",
          height: "640px",
          theme: "base",
          events: {
            onAppReady: (event) => {
              setPreviewStatus(mode + " ready");
            },
            onContentReady: (event) => {
              setPreviewStatus(mode + " content loaded");
            },
            onAppError: (event) => {
              setPreviewStatus(mode + " error");
            },
            onNoAccess: (event) => {
              setPreviewStatus("no access");
            },
            onNotFound: (event) => {
              setPreviewStatus("not found");
            }
          }
        };

        previewInstance =
          mode === "editor"
            ? DocSpace.SDK.initEditor(commonConfig)
            : DocSpace.SDK.initViewer({
                ...commonConfig,
                showHeader: false,
                showTitle: true
              });
      }

      function handleSelection(event) {
        const item = firstObjectWithId(event);
        if (!item) {
          setPreviewStatus("selection payload has no file id");
          return;
        }

        const fileId = item.id;
        const title = item.title || item.name || item.fileTitle || item.fileName || "";
        openSelectedFile(fileId, title);
      }

      function initSelector() {
        destroyInstance(selectorInstance);
        selectorInstance = null;
        resetPreview();
        setSelectorStatus("initializing...");

        selectorInstance = DocSpace.SDK.initFileSelector({
          frameId: "selector-frame",
          width: "100%",
          height: "640px",
          theme: "base",
          events: {
            onAppReady: () => {
              setSelectorStatus("ready");
            },
            onContentReady: () => {
              setSelectorStatus("content loaded");
            },
            onSelectCallback: (event) => {
              setSelectorStatus("file selected");
              handleSelection(event);
            },
            onCloseCallback: () => {
              setSelectorStatus("selector closed");
            },
            onNoAccess: (event) => {
              setSelectorStatus("no access");
            },
            onAppError: (event) => {
              setSelectorStatus("error");
            }
          }
        });
      }

      modeEl.addEventListener("change", () => {
        if (selectedFileId) openSelectedFile(selectedFileId, selectedFileTitle);
      });

      initSelector();
    </script>
  </body>
</html>
