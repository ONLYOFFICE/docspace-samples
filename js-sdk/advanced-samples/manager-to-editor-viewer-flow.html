<!--
Example: File selector to editor/viewer flow

Select a file in the file selector, then choose viewer or editor mode
to open it immediately in the same frame area.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Browse and Open Files" />
    <meta name="example-description" content="Use the file selector to browse DocSpace files, then open any selected file in an embedded editor or read-only viewer." />
    <meta name="example-group" content="advanced" />
    <title>Browse and Open Files</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-manager-to-editor-viewer-flow">
    <div class="result-split">
      <div class="result-split__frame">
        <!-- Step 1: file selector -->
        <div class="frame-wrap" id="selectorWrap">
          <iframe id="selector-frame"></iframe>
        </div>
        <!-- Step 2: viewer/editor shown after file selection -->
        <div class="frame-wrap" id="viewerWrap" style="display:none">
          <iframe id="preview-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button id="backBtn" type="button" class="btn btn--secondary" style="display:none">← Select another file</button>
          <span class="status" id="hint">Select a file to open</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 300px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file</label>
          <input id="selectedTitle" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label for="mode">Open as</label>
          <select id="mode">
            <option value="viewer">Viewer</option>
            <option value="editor">Editor</option>
          </select>
        </div>
      </div>
    </div>

    <script>
      const hint          = document.getElementById("hint");
      const selectedTitle = document.getElementById("selectedTitle");
      const modeEl        = document.getElementById("mode");
      const selectorWrap  = document.getElementById("selectorWrap");
      const viewerWrap    = document.getElementById("viewerWrap");
      const backBtn       = document.getElementById("backBtn");

      let previewInstance = null;
      let selected = null;

      function setHint(text) { hint.textContent = text; }

      function showSelector() {
        selectorWrap.style.display = "";
        viewerWrap.style.display   = "none";
        backBtn.style.display      = "none";
      }

      function showViewer() {
        selectorWrap.style.display = "none";
        viewerWrap.style.display   = "";
        backBtn.style.display      = "";
      }

      function destroyPreview() {
        if (previewInstance && typeof previewInstance.destroyFrame === "function") {
          try { previewInstance.destroyFrame(); } catch {}
        }
        previewInstance = null;
      }

      function openFile(file) {
        if (!file?.id) return;
        destroyPreview();
        showViewer();

        const mode = modeEl.value;
        setHint("Loading " + mode + "…");

        const config = {
          frameId: "preview-frame",
          id: String(file.id),
          width: "700px",
          height: "520px",
          theme: "base",
          events: {
            onAppReady:     () => setHint(mode === "editor" ? "Editor ready" : "Viewer ready"),
            onContentReady: () => setHint("Content loaded"),
            onNoAccess:     () => setHint("No access"),
            onNotFound:     () => setHint("Not found"),
            onAppError:     () => setHint("Error")
          }
        };

        previewInstance = mode === "editor"
          ? DocSpace.SDK.initEditor(config)
          : DocSpace.SDK.initViewer({ ...config, showHeader: false, showTitle: true });
      }

      // File selector
      DocSpace.SDK.initFileSelector({
        frameId: "selector-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            const id = item?.id ?? null;
            if (!id) return;
            selected = { id: String(id), title: item?.title || item?.name || `File ${id}` };
            selectedTitle.value = selected.title;
            openFile(selected);
          },
          onAppError: () => setHint("Selector error")
        }
      });

      // Re-open in new mode when mode changes (if a file is already selected)
      modeEl.addEventListener("change", () => {
        if (selected) openFile(selected);
      });

      backBtn.onclick = () => {
        destroyPreview();
        showSelector();
        setHint("Select a file to open");
      };
    </script>
  </body>
</html>
