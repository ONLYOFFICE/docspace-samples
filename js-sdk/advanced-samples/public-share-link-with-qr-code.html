<!--
Example: File selector to QR code

Select a file in the file selector, create a public share link via the backend,
and display a QR code for that link.

Prerequisites:
- Start local backend from `js-sdk` so `/api/create-public-share-link` is available.
- Set `PORTAL_SRC` and `ADMIN_API_KEY` in `js-sdk/.env`.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Share File via QR Code" />
    <meta name="example-description" content="Select a file, generate a public share link via the backend, and display it as a scannable QR code." />
    <meta name="example-group" content="advanced" />
    <title>Share File via QR Code</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-public-share-link-with-qr-code">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="selector-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <span class="status" id="hint">Select a file to generate a QR code</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 300px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file</label>
          <input id="selectedTitle" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label>Share link</label>
          <input id="shareLink" type="text" readonly placeholder="— will appear after selection —"
            style="font-family:ui-monospace,monospace;font-size:12px" />
        </div>

        <div style="flex:1;display:flex;align-items:center;justify-content:center;margin-top:16px">
          <div id="qrCode" style="
            width:240px;min-height:240px;
            display:flex;align-items:center;justify-content:center;
            background:#fff;border-radius:16px;
            box-shadow:inset 0 0 0 1px #e5e7eb;
          "></div>
        </div>
      </div>
    </div>

    <script>
      const hint           = document.getElementById("hint");
      const selectedTitleEl = document.getElementById("selectedTitle");
      const shareLinkEl    = document.getElementById("shareLink");
      const qrCodeEl       = document.getElementById("qrCode");

      let qrInstance = null;

      function setHint(text) { hint.textContent = text; }

      function clearQr() {
        qrCodeEl.innerHTML = "";
        qrInstance = null;
      }

      function renderQr(link) {
        clearQr();
        qrInstance = new QRCode(qrCodeEl, { text: link, width: 220, height: 220 });
      }

      async function createPublicLink(fileId) {
        const response = await fetch(window.location.origin + "/api/create-public-share-link", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ fileId: String(fileId) })
        });
        const json = await response.json().catch(() => null);
        if (!response.ok) throw new Error(json?.details || json?.error || "HTTP " + response.status);
        return json;
      }

      DocSpace.SDK.initFileSelector({
        frameId: "selector-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => setHint("Select a file to generate a QR code"),
          onSelectCallback: async (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            const id = item?.id ?? null;
            if (!id) return;

            const title = item?.title || item?.name || `File ${id}`;
            selectedTitleEl.value = title;
            shareLinkEl.value = "";
            clearQr();
            setHint("Creating public link…");

            try {
              const result = await createPublicLink(id);
              const link = String(result?.shareLink || "").trim();
              if (!link) throw new Error("shareLink missing in response");
              shareLinkEl.value = link;
              renderQr(link);
              setHint("QR code ready");
            } catch (error) {
              setHint("Error: " + (error?.message || String(error)));
            }
          },
          onAppError: () => setHint("Selector error")
        }
      });
    </script>
  </body>
</html>
