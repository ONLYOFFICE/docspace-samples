<!--
Example: Execute a command in an editor

Pick a .docx file via the file selector, then click Write & Save to run
editor automation via executeInEditor in a hidden editor frame.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
- editor.executeInEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#executeInEditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Insert Text into a DOCX File" />
    <meta name="example-description" content="Select a .docx file, programmatically insert a text paragraph via the editor API, and save — the editor runs in the background with no UI shown." />
    <meta name="example-group" content="advanced" />
    <title>Insert Text into a DOCX File</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-execute-in-hidden-editor">
    <div class="result-split">
      <div class="result-split__frame">
        <!-- Step 1: file selector -->
        <div class="frame-wrap" id="selectorWrap">
          <iframe id="ds-selector"></iframe>
        </div>
        <!-- Step 2: editor shown after Write & Save -->
        <div class="frame-wrap" id="editorWrap" style="display:none">
          <iframe id="ds-hidden-editor"></iframe>
        </div>
        <div class="bottom-bar">
          <button id="backBtn" type="button" class="btn btn--secondary" style="display:none">← Select another file</button>
          <span class="status" id="hint">Select a .docx file</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 360px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file ID</label>
          <input id="selectedId" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="append">Append paragraphs</option>
            <option value="replace">Replace document</option>
          </select>
        </div>

        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:10px">
          <label for="text">Text <span style="color:#9ca3af;font-weight:400">(each line = paragraph)</span></label>
          <textarea id="text" style="flex:1;resize:none;font-family:ui-monospace,monospace;font-size:12px" placeholder="Hello from executeInEditor!&#10;This paragraph was added in a hidden editor."></textarea>
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="run" type="button" class="btn" disabled>Write &amp; Save</button>
          <span class="status" id="actionStatus"></span>
        </div>
      </div>
    </div>

    <script>
      const hint         = document.getElementById("hint");
      const selectedIdEl = document.getElementById("selectedId");
      const modeEl       = document.getElementById("mode");
      const textEl       = document.getElementById("text");
      const run          = document.getElementById("run");
      const actionStatus = document.getElementById("actionStatus");
      const selectorWrap = document.getElementById("selectorWrap");
      const editorWrap   = document.getElementById("editorWrap");
      const backBtn      = document.getElementById("backBtn");

      let editorInstance = null;
      let selected = null;

      function setHint(text)   { hint.textContent = text; }
      function setStatus(text) { actionStatus.textContent = text; }

      function showSelector() {
        selectorWrap.style.display = "";
        editorWrap.style.display   = "none";
        backBtn.style.display      = "none";
      }

      function showEditor() {
        selectorWrap.style.display = "none";
        editorWrap.style.display   = "";
        backBtn.style.display      = "";
      }

      function updateUI() {
        selectedIdEl.value = selected?.id ? String(selected.id) : "";
        run.disabled = !selected?.id;
      }

      function destroyEditor() {
        if (editorInstance && typeof editorInstance.destroyFrame === "function") {
          try { editorInstance.destroyFrame(); } catch {}
        }
        editorInstance = null;
      }

      // File selector
      DocSpace.SDK.initFileSelector({
        frameId: "ds-selector",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            const id = item?.id ?? null;
            if (!id) return;
            selected = { id: String(id), title: item?.title || item?.name || `File ${id}` };
            setHint(`Selected: ${selected.title}`);
            setStatus("");
            updateUI();
          },
          onAppError: () => setHint("Selector error")
        }
      });

      backBtn.onclick = () => {
        destroyEditor();
        showSelector();
        setHint(selected ? `Selected: ${selected.title}` : "Select a .docx file");
        setStatus("");
      };

      function buildDocxCommand(text, mode) {
        const payloadText = JSON.stringify(String(text ?? ""));
        const payloadMode = JSON.stringify(String(mode ?? "append"));
        return new Function(
          "editorInstance",
          `try {
            const text = ${payloadText};
            const mode = ${payloadMode};
            const connector = editorInstance?.createConnector?.();
            if (!connector?.callCommand) return;

            Asc.scope.text = text;
            Asc.scope.mode = mode;
            connector.callCommand(function () {
              try {
                const doc = Api.GetDocument && Api.GetDocument();
                if (!doc) return;

                const mode = String(Asc.scope.mode || "append").toLowerCase();
                const lines = String(Asc.scope.text || "").replace(/\\r\\n/g, "\\n").split("\\n");

                function pushParagraph(line) {
                  const p = Api.CreateParagraph();
                  p.AddText(line);
                  if (typeof doc.Push === "function") doc.Push(p);
                  else if (typeof doc.InsertContent === "function") doc.InsertContent([p], true);
                }

                if (mode === "replace") {
                  if (typeof doc.RemoveAllElements === "function") doc.RemoveAllElements();
                }

                if (!lines.some(l => String(l).trim())) { pushParagraph("No text"); Api.Save(); return; }
                for (const line of lines) pushParagraph(String(line));
                Api.Save();
              } catch (error) { console.error("DOCX command failed", error); }
            });
          } catch (error) { console.error("executeInEditor build failed", error); }`
        );
      }

      run.onclick = () => {
        if (!selected?.id) return;
        destroyEditor();
        run.disabled = true;
        setStatus("Opening editor…");
        showEditor();
        setHint("Loading editor…");

        editorInstance = DocSpace.SDK.initEditor({
          id: selected.id,
          frameId: "ds-hidden-editor",
          width: "700px",
          height: "520px",
          theme: "base",
          events: {
            onAppReady: () => {
              setHint("Executing command…");
              setStatus("Executing…");
              const frame = DocSpace?.SDK?.frames?.["ds-hidden-editor"];
              if (!frame || typeof frame.executeInEditor !== "function") {
                setStatus("executeInEditor not available");
                setHint("Error");
                run.disabled = false;
                return;
              }
              try {
                frame.executeInEditor(buildDocxCommand(textEl.value, modeEl.value));
                setStatus("Done");
                setHint("Saved");
              } catch (error) {
                setStatus("Execute failed: " + (error?.message || String(error)));
              }
              run.disabled = false;
            },
            onAppError: (e) => {
              setStatus("Editor error");
              setHint("Error");
              destroyEditor();
              showSelector();
              run.disabled = false;
            }
          }
        });
      };

      textEl.value = "Hello from executeInEditor!\nThis paragraph was added in a hidden editor.";
      updateUI();
    </script>
  </body>
</html>
