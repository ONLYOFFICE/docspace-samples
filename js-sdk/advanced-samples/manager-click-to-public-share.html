<!--
Example: File selector to public share

This example demonstrates how to select a file in the DocSpace file selector, create a public share link via backend,
and open the resulting link.

Prerequisites:
- Start local backend from `js-sdk` so `/api/create-public-share-link` is available.
- Set `PORTAL_SRC` and `ADMIN_API_KEY` in `js-sdk/.env`.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get Public Share Link for a File" />
    <meta name="example-description" content="Browse files in the manager, click any file to generate a public share link via the backend, and open the link in a new tab." />
    <meta name="example-group" content="advanced" />
    <title>Get Public Share Link for a File</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-manager-click-to-public-share">
    <div class="page">
      <div class="card">
        <div class="layout">
          <section class="panel">
            <div class="panel-header">
              <span class="panel-title">File selector</span>
              <span class="panel-hint">Select a file in DocSpace.</span>
            </div>
            <iframe id="selector-frame"></iframe>
          </section>

          <section class="panel">
            <div class="panel-header">
              <span class="panel-title">Share result</span>
              <span class="panel-hint" id="selectedHint">No file selected</span>
            </div>

            <div class="selection-card">
              <div class="selection-row"><strong>Title:</strong> <span id="selectedFileTitle">-</span></div>
              <div class="selection-row"><strong>Share link:</strong> <a id="selectedShareLink" href="#" target="_blank" rel="noopener noreferrer">-</a></div>
            </div>
          </section>
        </div>

        <div class="actions" style="margin-top:12px">
          <button class="btn" id="createLinkBtn" type="button" disabled>Create public link</button>
          <span class="status" id="status">Select a file in the left panel</span>
        </div>
      </div>
    </div>

    <script>
      const createLinkBtn = document.getElementById("createLinkBtn");
      const statusEl = document.getElementById("status");
      const selectedHintEl = document.getElementById("selectedHint");
      const selectedFileTitleEl = document.getElementById("selectedFileTitle");
      const selectedShareLinkEl = document.getElementById("selectedShareLink");

      let selectorInstance = null;
      let selectedItem = null;
      let lastShareLink = "";
      const BACKEND_ENDPOINT = window.location.origin + "/api/create-public-share-link";

      function setStatus(value) {
        statusEl.textContent = value;
      }

      function updateSelectionCard() {
        const title =
          selectedItem && (selectedItem.title || selectedItem.name || selectedItem.fileTitle || selectedItem.fileName)
            ? String(selectedItem.title || selectedItem.name || selectedItem.fileTitle || selectedItem.fileName)
            : "-";

        selectedFileTitleEl.textContent = title;
        selectedShareLinkEl.textContent = lastShareLink || "-";
        selectedShareLinkEl.href = lastShareLink || "#";
        selectedHintEl.textContent = selectedItem && selectedItem.id ? "Selected file is ready for public sharing" : "No file selected";
      }

      function destroySelector() {
        if (selectorInstance && typeof selectorInstance.destroyFrame === "function") {
          try {
            selectorInstance.destroyFrame();
          } catch {}
        }

        selectorInstance = null;
      }

      function initSelector() {
        destroySelector();
        selectedItem = null;
        lastShareLink = "";
        updateSelectionCard();
        setStatus("Initializing selector...");

        selectorInstance = DocSpace.SDK.initFileSelector({
          frameId: "selector-frame",
          width: "100%",
          height: "640px",
          theme: "base",
          events: {
            onAppReady: () => {
              setStatus("Selector ready");
            },
            onContentReady: () => {
              setStatus("Selector loaded. Select a file.");
            },
            onSelectCallback: (event) => {
              selectedItem = event && typeof event === "object" ? event : null;
              lastShareLink = "";
              updateSelectionCard();
              createLinkBtn.disabled = !(selectedItem && selectedItem.id);
              setStatus(selectedItem && selectedItem.id ? "File selected" : "Selection updated");
            },
            onCloseCallback: () => {
              setStatus("Selector closed");
            },
            onAppError: () => {
              setStatus("Selector error");
            }
          }
        });
      }

      function buildBackendPayload() {
        if (!selectedItem || !selectedItem.id) {
          throw new Error("Select a file in the left panel first.");
        }

        return {
          fileId: String(selectedItem.id),
          title: selectedItem.title || selectedItem.name || selectedItem.fileTitle || selectedItem.fileName || null,
          createPrimaryLink: true
        };
      }

      async function callBackend(payload) {
        const response = await fetch(BACKEND_ENDPOINT, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify(payload)
        });

        const json = await response.json().catch(() => null);

        if (!response.ok) {
          throw new Error(json?.details || json?.error || "HTTP " + response.status);
        }

        return json;
      }

      async function createPublicLink() {
        setStatus("Creating public link...");

        try {
          const payload = buildBackendPayload();
          const response = await callBackend(payload);

          lastShareLink = String(response?.shareLink || "").trim();
          if (!lastShareLink) throw new Error("shareLink is missing in backend response.");
          updateSelectionCard();
          setStatus("Public link created");
        } catch (error) {
          setStatus("Public link creation failed: " + (error.message || String(error)));
        }
      }

      createLinkBtn.addEventListener("click", createPublicLink);

      initSelector();
    </script>
  </body>
</html>
