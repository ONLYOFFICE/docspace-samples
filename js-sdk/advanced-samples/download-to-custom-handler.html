<!--
Example: Download to custom handler

This example demonstrates how to intercept file download links from the manager UI.
Instead of letting DocSpace download a file immediately, the SDK sends the download payload to your application.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Intercept File Downloads" />
    <meta name="example-description" content="Intercept file download requests from the DocSpace manager and handle them in your own code — for example, to route files to a custom download service." />
    <meta name="example-group" content="advanced" />
    <title>Intercept File Downloads</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-download-to-custom-handler">
    <div class="page">
      <div class="card">
        <div class="ex-download-to-custom-handler__layout">
          <section class="ex-download-to-custom-handler__main">
            <iframe id="ds-frame" title="DocSpace manager"></iframe>
            <div class="bottom-bar">
              <button class="btn" id="initBtn" type="button">Init manager</button>
              <button class="btn secondary" id="copyBtn" type="button">Copy URL</button>
              <button class="btn secondary" id="openBtn" type="button">Open link</button>
              <span class="status" id="status">Ready</span>
            </div>
          </section>

          <aside class="ex-download-to-custom-handler__aside">
            <p class="ex-download-to-custom-handler__hint">
              Click <strong>Download</strong> inside the manager. The intercepted link will appear here instead of being downloaded immediately.
            </p>
            <div class="field">
              <label for="downloadUrl">Download URL</label>
              <textarea class="output" id="downloadUrl" readonly placeholder="Download link from onDownload will appear here..."></textarea>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const downloadUrlEl = document.getElementById("downloadUrl");
      const initBtn = document.getElementById("initBtn");
      const copyBtn = document.getElementById("copyBtn");
      const openBtn = document.getElementById("openBtn");

      let managerInstance = null;
      let lastDownloadUrl = "";

      function setStatus(value) {
        statusEl.textContent = value;
      }

      function setDownloadUrl(value) {
        lastDownloadUrl = String(value || "");
        downloadUrlEl.value = lastDownloadUrl;
      }

      function extractUrl(payload) {
        if (!payload) return "";
        if (typeof payload === "string") return payload;

        if (typeof payload.url === "string") return payload.url;
        if (typeof payload.downloadUrl === "string") return payload.downloadUrl;
        if (typeof payload.link === "string") return payload.link;

        if (payload.data && typeof payload.data === "object") {
          if (typeof payload.data.url === "string") return payload.data.url;
          if (typeof payload.data.downloadUrl === "string") return payload.data.downloadUrl;
          if (typeof payload.data.link === "string") return payload.data.link;
        }

        return "";
      }

      function destroyFrame() {
        if (managerInstance && typeof managerInstance.destroyFrame === "function") {
          try {
            managerInstance.destroyFrame();
          } catch {}
        }

        managerInstance = null;
        setStatus("Destroyed");
      }

      function initManager() {
        destroyFrame();
        setDownloadUrl("");
        setStatus("Initializing manager...");

        managerInstance = DocSpace.SDK.initManager({
          frameId: "ds-frame",
          width: "100%",
          height: "620px",
          theme: "base",
          showHeader: true,
          showMenu: true,
          downloadToEvent: true,
          events: {
            onAppReady: () => {
              setStatus("Manager ready");
            },
            onContentReady: () => {
              setStatus("Manager loaded. Click Download inside DocSpace.");
            },
            onDownload: (event) => {
              const url = extractUrl(event);
              setDownloadUrl(url);
              setStatus(url ? "Download intercepted" : "Download event received");
            },
            onAppError: (event) => {
              setStatus("App error");
            },
            onNoAccess: (event) => {
              setStatus("No access");
            }
          }
        });
      }

      async function copyUrl() {
        if (!lastDownloadUrl) {
          setStatus("Nothing to copy");
          return;
        }

        try {
          await navigator.clipboard.writeText(lastDownloadUrl);
          setStatus("URL copied");
        } catch {
          setStatus("Clipboard unavailable");
        }
      }

      function openUrl() {
        if (!lastDownloadUrl) {
          setStatus("No download URL");
          return;
        }

        window.open(lastDownloadUrl, "_blank", "noopener,noreferrer");
        setStatus("Download link opened");
      }

      initBtn.addEventListener("click", initManager);
      copyBtn.addEventListener("click", copyUrl);
      openBtn.addEventListener("click", openUrl);

      setDownloadUrl("");
    </script>
  </body>
</html>
