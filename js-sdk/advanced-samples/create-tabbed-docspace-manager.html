<!--
Example: Create a tabbed DocSpace manager UI

This example demonstrates how to embed ONLYOFFICE DocSpace in a tabbed interface,
where each tab is an independent SDK instance (Manager, File Selector, or Room Selector)
in its own iframe. Switching tabs shows/hides iframes via display:none/block — the state
of each instance is preserved when it is hidden.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Tabbed DocSpace Manager" />
    <meta name="example-description" content="Open multiple DocSpace modes (Manager, File Selector, Room Selector) in independent tabs. Switch freely — each tab keeps its own state." />
    <meta name="example-group" content="advanced" />
    <title>Tabbed DocSpace Manager</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-tabbed-docspace-manager">
    <div class="page">
      <div class="card ex-tdm-card">

        <!-- Toolbar -->
        <div class="ex-tdm-toolbar">
          <select id="modeSelect" class="ex-tdm-mode-select" disabled>
            <option value="manager">Manager</option>
            <option value="file-selector">File selector</option>
            <option value="room-selector">Room selector</option>
          </select>
          <button id="newTab" type="button" class="btn" disabled>+ New tab</button>
          <button id="closeAll" type="button" class="btn secondary" disabled>Close all</button>
          <span class="status" id="status">Preparing SDK…</span>
        </div>

        <!-- Tabs bar -->
        <div id="tabsBar" class="ex-tdm-tabsbar" aria-label="Tabs"></div>

        <!-- Content area — iframes are absolutely positioned here -->
        <div id="content" class="ex-tdm-content"></div>

      </div>
    </div>

    <script>
      const newTabBtn   = document.getElementById("newTab");
      const closeAllBtn = document.getElementById("closeAll");
      const modeSelect  = document.getElementById("modeSelect");
      const statusEl    = document.getElementById("status");
      const tabsBar     = document.getElementById("tabsBar");
      const content     = document.getElementById("content");

      const MODE_LABELS = {
        "manager":       "Manager",
        "file-selector": "File selector",
        "room-selector": "Room selector"
      };

      // tabs: [{ id, mode, title, frameId, iframe, instance, ready, error }]
      const tabs = [];
      let activeId = "";
      let tabSeq   = 0;
      let sdkReady = false;

      function setStatus(text) { statusEl.textContent = text; }
      function uid() {
        return "t-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      }

      function setActive(id) { activeId = id; render(); }

      function updateControls() {
        newTabBtn.disabled   = !sdkReady;
        closeAllBtn.disabled = !sdkReady || !tabs.length;
        modeSelect.disabled  = !sdkReady;
      }

      // ── Tab lifecycle ────────────────────────────────────────────────

      function addTab() {
        const mode    = modeSelect.value;
        tabSeq += 1;
        const id      = uid();
        const frameId = "ds-frame-" + id;

        // Pre-create the iframe — SDK will set src directly on this element.
        // Do NOT pre-hide: SDK must initialize in a rendered iframe (non-zero size).
        // renderFrames() called below will hide inactive tabs.
        const iframe = document.createElement("iframe");
        iframe.id        = frameId;
        iframe.className = "ex-tdm-frame";
        iframe.setAttribute("allow", "clipboard-read; clipboard-write; microphone; camera");
        content.appendChild(iframe);

        const tab = {
          id,
          mode,
          title: (MODE_LABELS[mode] || mode) + " #" + tabSeq,
          frameId,
          iframe,
          instance: null,
          ready: false,
          error: ""
        };
        tabs.push(tab);
        activeId = id;

        const commonConfig = {
          frameId,
          width:  "100%",
          height: "100%",
          theme:  "base",
          events: {
            onAppReady: () => { tab.ready = true; tab.error = ""; setStatus("Ready"); render(); },
            onAppError: (e) => { tab.error = error?.message || String(e || "Error"); setStatus("Error in tab"); render(); }
          }
        };

        if (mode === "manager") {
          tab.instance = DocSpace.SDK.initManager(commonConfig);
        } else if (mode === "file-selector") {
          tab.instance = DocSpace.SDK.initFileSelector({
            ...commonConfig,
            showSelectorHeader: true,
            showSelectorCancel: false,
            withSearch:         true,
            withBreadCrumbs:    true
          });
        } else {
          tab.instance = DocSpace.SDK.initRoomSelector({
            ...commonConfig,
            showSelectorHeader: true,
            showSelectorCancel: false,
            withSearch:         true
          });
        }

        render();
      }

      function destroyTab(tab) {
        if (!tab) return;
        try { if (tab.instance?.destroyFrame) tab.instance.destroyFrame(); } catch {}
        try { tab.iframe?.remove(); } catch {}
      }

      function closeTab(id) {
        const idx = tabs.findIndex((t) => t.id === id);
        if (idx === -1) return;
        destroyTab(tabs[idx]);
        tabs.splice(idx, 1);
        if (activeId === id) {
          const next = tabs[Math.max(0, idx - 1)] || tabs[0] || null;
          activeId = next ? next.id : "";
        }
        render();
      }

      function closeAll() {
        while (tabs.length) destroyTab(tabs.pop());
        activeId = "";
        render();
      }

      // ── Rendering ────────────────────────────────────────────────────

      function tabStatusText(tab) {
        if (!tab)       return "";
        if (tab.error)  return tab.error;
        if (!tab.ready) return "Loading…";
        return "Ready";
      }

      function renderTabsBar() {
        tabsBar.innerHTML = "";

        if (!tabs.length) {
          const empty = document.createElement("div");
          empty.className   = "ex-tdm-empty";
          empty.textContent = 'No tabs — click "+ New tab" to add one.';
          tabsBar.appendChild(empty);
          return;
        }

        for (const tab of tabs) {
          const isActive = tab.id === activeId;

          const chip = document.createElement("div");
          chip.className = "ex-tdm-chip" + (isActive ? " active" : "");
          chip.onclick   = () => setActive(tab.id);

          const title = document.createElement("span");
          title.className   = "ex-tdm-chip-title";
          title.textContent = tab.title;

          const meta = document.createElement("span");
          meta.className   = "ex-tdm-chip-meta";
          meta.textContent = tabStatusText(tab);

          const closeBtn = document.createElement("button");
          closeBtn.type        = "button";
          closeBtn.className   = "ex-tdm-chip-close";
          closeBtn.textContent = "✕";
          closeBtn.title       = "Close tab";
          closeBtn.onclick     = (e) => { e.stopPropagation(); closeTab(tab.id); };

          chip.appendChild(title);
          chip.appendChild(meta);
          chip.appendChild(closeBtn);
          tabsBar.appendChild(chip);
        }
      }

      function renderFrames() {
        // Show/hide iframes directly — browsers preserve iframe state when hidden
        for (const tab of tabs) {
          tab.iframe.style.display = tab.id === activeId ? "" : "none";
        }
      }

      function render() {
        renderTabsBar();
        renderFrames();
        updateControls();
      }

      // ── Init ─────────────────────────────────────────────────────────

      newTabBtn.addEventListener("click", addTab);
      closeAllBtn.addEventListener("click", closeAll);

      if (window.DocSpace && window.DocSpace.SDK) {
        sdkReady = true;
        setStatus("SDK ready");
        addTab();
      } else {
        setStatus("SDK not found — check portal URL");
        render();
      }
    </script>
  </body>
</html>
