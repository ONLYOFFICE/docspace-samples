<!--
Example: Create files in rooms

This example demonstrates how to create tasks linked to rooms in DocSpace, and then create files inside those rooms using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createFile (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createfile)
- manager.getFolderInfo (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getfolderinfo)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Create File from a Task" />
    <meta name="example-description" content="Open a room in the manager, navigate to any folder, and create a new file at the current location — simulates file creation from a task workflow." />
    <meta name="example-group" content="advanced" />
    <title>Create File from a Task</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-task-file-create">
    <div class="frame-wrap">
      <iframe id="ds-frame"></iframe>
    </div>

    <div class="bottom-bar">
      <input id="roomId" type="text" placeholder="Room ID" autocomplete="off" />
      <button id="openRoomBtn" class="btn secondary" type="button" disabled>Open room</button>
      <input id="name" type="text" placeholder="task.docx" autocomplete="off" />
      <button id="btn" class="btn" type="button" disabled>Create task file</button>
      <span class="status" id="status">Enter a room ID</span>
    </div>

    <script>
      const roomIdInput = document.getElementById("roomId");
      const openRoomBtn = document.getElementById("openRoomBtn");

      const nameInput = document.getElementById("name");
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");

      let docSpace = null;
      let ready = false;
      let currentRoomId = "";

      function updateButtons() {
        const roomId = roomIdInput.value.trim();
        const name = nameInput.value.trim();

        openRoomBtn.disabled = !roomId;
        btn.disabled = !ready || !name;
      }

      // Auto-fill from demo session if available
      (function () {
        const s = window.__demoConfig?.session;
        if (!s) return;
        if (s?.roomId) roomIdInput.value = String(s.roomId);
        if (!nameInput.value.trim()) nameInput.value = "demo-task.docx";
        status.textContent = roomIdInput.value.trim() ? "Click “Open room”" : "Enter a room ID";
        updateButtons();
      })();

      roomIdInput.addEventListener("input", () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
          status.textContent = "Enter a room ID";
        } else if (!ready || roomId !== currentRoomId) {
          status.textContent = "Click \u201cOpen room\u201d";
        }
        updateButtons();
      });

      nameInput.addEventListener("input", updateButtons);

      openRoomBtn.onclick = () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) return;

        // Reset state
        ready = false;
        currentRoomId = roomId;
        btn.disabled = true;
        status.textContent = "Loading…";

        // Recreate iframe to ensure a clean Manager instance
        const oldFrame = document.getElementById("ds-frame");
        const newFrame = oldFrame.cloneNode(false);
        oldFrame.parentNode.replaceChild(newFrame, oldFrame);
        newFrame.id = "ds-frame";

        docSpace = DocSpace.SDK.initManager({
          frameId: "ds-frame",
          width: "900px",
          height: "640px",
          theme: "base",
          rootPath: "/rooms/shared/" + roomId,
          filter: { folder: roomId },
          events: {
            onAppReady: function () {
              ready = true;
              status.textContent = "Room opened. Ready";
              updateButtons();
            },
            onAppError: function () {
              ready = false;
              status.textContent = "Error opening room";
              updateButtons();
            }
          }
        });

        updateButtons();
      };

      btn.onclick = async () => {
        const name = nameInput.value.trim();
        if (!ready || !docSpace || !name) return;

        btn.disabled = true;
        status.textContent = "Creating…";

        try {
          const folderInfo = await docSpace.getFolderInfo();
          const folderId = String(folderInfo?.id || "").trim();
          if (!folderId) throw new Error("Folder ID is missing in getFolderInfo response.");

          await docSpace.createFile(folderId, name);

          status.textContent = "Done";
        } catch (error) {
          status.textContent = "Failed";
        } finally {
          updateButtons();
        }
      };

      updateButtons();
    </script>
  </body>
</html>
