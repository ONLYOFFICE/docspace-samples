<!--
Example: Build PPTX presentation

Select a room, create a new PPTX file in that room, generate slides via executeInEditor,
and then open the result in the editor.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createFile (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createfile)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Build a PPTX Presentation" />
    <meta name="example-description" content="Choose a room, create a new .pptx file, and auto-generate a 3-slide presentation via the editor API. The result opens in the embedded editor." />
    <meta name="example-group" content="advanced" />
    <title>Build a PPTX Presentation</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-create-file">
    <div id="selectorWrap">
      <div class="frame-wrap">
        <iframe id="ds-room-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <input id="fileName" type="text" placeholder="Quarterly_Deck.pptx" value="Quarterly_Deck.pptx" autocomplete="off" />
        <button class="btn" id="createBtn" type="button" disabled>Create and Generate PPTX</button>
        <span class="status" id="status">Select a room</span>
      </div>
    </div>

    <div id="editorWrap" style="display:none">
      <div class="frame-wrap">
        <iframe id="editor-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <button class="btn secondary" id="backBtn" type="button">Create another</button>
        <span class="status" id="editorStatus">Opening editor...</span>
      </div>
    </div>

    <iframe id="ds-manager-frame" class="hidden-frame"></iframe>
    <iframe id="ds-hidden-editor" class="hidden-frame" title="Hidden editor frame"></iframe>

    <script>
      const createBtn = document.getElementById("createBtn");
      const fileNameEl = document.getElementById("fileName");
      const statusEl = document.getElementById("status");
      const backBtn = document.getElementById("backBtn");
      const editorStatusEl = document.getElementById("editorStatus");
      const selectorWrap = document.getElementById("selectorWrap");
      const editorWrap = document.getElementById("editorWrap");

      let selectedRoomId = null;
      let managerReady = false;
      let roomSelectorInstance = null;
      let hiddenEditorInstance = null;
      let visibleEditorInstance = null;
      const portalSrc = String(document.querySelector("base")?.href || "").replace(/\/+$/, "");

      function extractId(data) {
        if (!data || typeof data !== "object") return null;
        if (Array.isArray(data)) {
          const first = data[0];
          return first?.id != null && String(first.id).trim() ? String(first.id).trim() : null;
        }
        if (data.id != null && String(data.id).trim()) return String(data.id).trim();
        if (Array.isArray(data.items) && data.items[0]?.id != null) return String(data.items[0].id).trim();
        if (data.item?.id != null) return String(data.item.id).trim();
        if (data.selected?.id != null) return String(data.selected.id).trim();
        return null;
      }

      function isValidPptxName(name) {
        const value = String(name || "").trim();
        return Boolean(value) && value.toLowerCase().endsWith(".pptx");
      }

      function updateCreateButtonState() {
        createBtn.disabled = !managerReady || !selectedRoomId || !isValidPptxName(fileNameEl.value);
      }

      function destroyInstance(instance) {
        if (!instance || typeof instance.destroyFrame !== "function") return;
        try {
          instance.destroyFrame();
        } catch {}
      }

      function showSelector() {
        destroyInstance(visibleEditorInstance);
        visibleEditorInstance = null;
        editorWrap.style.display = "none";
        selectorWrap.style.display = "";
        statusEl.textContent = selectedRoomId ? "Room selected" : "Select a room";
        editorStatusEl.textContent = "Opening editor...";
        updateCreateButtonState();
      }

      function buildDeckCommand() {
        return new Function(
          "editorInstance",
          `
            try {
              const connector = editorInstance?.createConnector?.();
              if (!connector?.callCommand) return;

              connector.callCommand(function () {
                try {
                  const presentation = Api.GetPresentation();
                  if (!presentation) return;

                  function addSlideWithTitle(title, bg) {
                    let slide = null;
                    if (typeof Api.CreateSlide === "function" && typeof presentation.AddSlide === "function") {
                      slide = Api.CreateSlide();
                      presentation.AddSlide(slide);
                    } else if (typeof presentation.GetSlideByIndex === "function") {
                      slide = presentation.GetSlideByIndex(0);
                    }
                    if (!slide) return;

                    if (typeof slide.RemoveAllObjects === "function") slide.RemoveAllObjects();
                    if (typeof slide.SetBackground === "function") {
                      const fill = Api.CreateSolidFill(Api.CreateRGBColor(bg[0], bg[1], bg[2]));
                      slide.SetBackground(fill);
                    }

                    const shape = Api.CreateShape(
                      "rect",
                      7000000,
                      1200000,
                      Api.CreateNoFill(),
                      Api.CreateStroke(0, Api.CreateNoFill())
                    );
                    shape.SetPosition(900000, 900000);
                    const content = shape.GetDocContent();
                    content.RemoveAllElements();

                    const paragraph = Api.CreateParagraph();
                    paragraph.SetSpacingBefore(0);
                    paragraph.SetSpacingAfter(0);
                    paragraph.SetJc("left");
                    content.Push(paragraph);

                    const run = paragraph.AddText(title);
                    run.SetFill(Api.CreateSolidFill(Api.CreateRGBColor(0xff, 0xff, 0xff)));
                    run.SetFontSize(64);
                    run.SetFontFamily("Georgia");
                    run.SetBold(true);

                    slide.AddObject(shape);
                  }

                  addSlideWithTitle("Project Overview", [36, 54, 74]);
                  addSlideWithTitle("Milestones", [48, 70, 86]);
                  addSlideWithTitle("Next Steps", [60, 86, 102]);

                  Api.Save();
                } catch {}
              });
            } catch {}
          `
        );
      }

      function getCreatedFileId(res) {
        const id = res?.id ?? res?.fileId ?? res?.entryId ?? res?.documentId ?? "";
        return id ? String(id).trim() : "";
      }

      function runHiddenBuildAndSave(fileId) {
        destroyInstance(hiddenEditorInstance);
        hiddenEditorInstance = null;
        return new Promise((resolve, reject) => {
          let done = false;
          const finish = (err) => {
            if (done) return;
            done = true;
            destroyInstance(hiddenEditorInstance);
            hiddenEditorInstance = null;
            if (err) reject(err);
            else resolve();
          };

          const timeout = setTimeout(() => {
            finish(new Error("Hidden editor timeout"));
          }, 30000);

          hiddenEditorInstance = DocSpace.SDK.initEditor({
            frameId: "ds-hidden-editor",
            id: String(fileId),
            width: "1px",
            height: "1px",
            theme: "base",
            events: {
              onAppReady: () => {
                const frame = DocSpace?.SDK?.frames?.["ds-hidden-editor"];
                if (!frame || typeof frame.executeInEditor !== "function") {
                  clearTimeout(timeout);
                  finish(new Error("executeInEditor is not available"));
                  return;
                }

                try {
                  frame.executeInEditor(buildDeckCommand());
                } catch (error) {
                  clearTimeout(timeout);
                  finish(e);
                  return;
                }

                setTimeout(() => {
                  clearTimeout(timeout);
                  finish();
                }, 8000);
              },
              onAppError: (e) => {
                clearTimeout(timeout);
                finish(e || new Error("Hidden editor failed to load"));
              }
            }
          });
        });
      }

      function openResultEditor(fileId) {
        destroyInstance(visibleEditorInstance);
        visibleEditorInstance = null;

        selectorWrap.style.display = "none";
        editorWrap.style.display = "";
        editorStatusEl.textContent = "Opening editor...";

        visibleEditorInstance = DocSpace.SDK.initEditor({
          frameId: "editor-frame",
          id: String(fileId),
          width: "960px",
          height: "600px",
          theme: "base",
          events: {
            onAppReady: () => {
              editorStatusEl.textContent = "Presentation generated and opened";
            },
            onAppError: () => {
              editorStatusEl.textContent = "Editor failed to load";
            }
          }
        });
      }

      roomSelectorInstance = DocSpace.SDK.initRoomSelector({
        frameId: "ds-room-frame",
        src: portalSrc,
        width: "960px",
        height: "600px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            selectedRoomId = extractId(data);
            statusEl.textContent = selectedRoomId ? "Room selected" : "Select a room";
            updateCreateButtonState();
          },
          onAppError: () => {
            statusEl.textContent = "Selector error";
          }
        }
      });

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-manager-frame",
        src: portalSrc,
        width: "0px",
        height: "0px",
        theme: "base",
        events: {
          onAppReady: () => {
            managerReady = true;
            updateCreateButtonState();
          },
          onContentReady: () => {
            managerReady = true;
            updateCreateButtonState();
          },
          onAppError: () => {
            managerReady = false;
            statusEl.textContent = "Manager is not ready";
            updateCreateButtonState();
          }
        }
      });

      fileNameEl.addEventListener("input", () => {
        if (fileNameEl.value && !isValidPptxName(fileNameEl.value)) {
          statusEl.textContent = "File name must end with .pptx";
        } else if (selectedRoomId) {
          statusEl.textContent = "Room selected";
        } else {
          statusEl.textContent = "Select a room";
        }
        updateCreateButtonState();
      });

      createBtn.addEventListener("click", async () => {
        const fileName = String(fileNameEl.value || "").trim();
        if (!isValidPptxName(fileName)) return;
        if (!managerReady) {
          statusEl.textContent = "Manager is not ready";
          return;
        }
        if (!selectedRoomId) {
          statusEl.textContent = "Select a room";
          return;
        }

        createBtn.disabled = true;
        statusEl.textContent = "Creating file...";

        try {
          const created = await manager.createFile(String(selectedRoomId), fileName);
          const fileId = getCreatedFileId(created);
          if (!fileId) throw new Error("File ID is missing in createFile response");
          if (typeof window.__demoTrack === "function") {
            window.__demoTrack("file", fileId); // demo only — replace with your own file ID handling
          }

          statusEl.textContent = "Generating slides...";
          await runHiddenBuildAndSave(fileId);
          openResultEditor(fileId);
          statusEl.textContent = "Done";
        } catch (error) {
          selectorWrap.style.display = "";
          editorWrap.style.display = "none";
          statusEl.textContent = "Error: " + (error?.message || String(error));
          updateCreateButtonState();
        }
      });

      backBtn.addEventListener("click", showSelector);
    </script>
  </body>
</html>
