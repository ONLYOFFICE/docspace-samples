<!--
Example: Error handling and CSP check

This example demonstrates how to enable the CSP preflight check and inspect common SDK error events.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Error Handling and CSP Check" />
    <meta name="example-description" content="Detect Content Security Policy issues before the frame loads, and handle access denied, file not found, and general errors via SDK events." />
    <meta name="example-group" content="advanced" />
    <title>Error Handling and CSP Check</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-error-handling-and-csp-check">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <span class="status" id="status">Ready</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 460px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="manager">Manager</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>

        <div class="field" id="fileIdField" style="flex:0 0 auto;margin-top:10px">
          <label for="fileId">File ID</label>
          <input id="fileId" type="text" placeholder="Required for viewer mode" autocomplete="off" />
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px;flex-wrap:wrap;gap:8px">
          <label class="ex-error-csp-checkbox">
            <input id="checkCsp" type="checkbox" checked />
            <span>checkCSP</span>
          </label>
          <label class="ex-error-csp-checkbox" id="showHeaderLabel">
            <input id="showHeader" type="checkbox" checked />
            <span>Show header</span>
          </label>
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="initBtn" type="button" class="btn">Init frame</button>
          <button id="destroyBtn" type="button" class="btn btn--secondary">Destroy</button>
          <button id="clearBtn" type="button" class="btn btn--secondary">Clear log</button>
        </div>

        <div class="field" style="flex:0 0 auto;margin-top:12px">
          <label>Init config</label>
          <textarea class="output" id="configLog" readonly style="height:100px;resize:none" placeholder="Config will appear here…"></textarea>
        </div>

        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:10px">
          <label>Event log</label>
          <textarea class="output" id="eventLog" readonly style="flex:1;resize:none" placeholder="SDK events will appear here…"></textarea>
        </div>
      </div>
    </div>

    <script>
      const modeEl        = document.getElementById("mode");
      const fileIdEl      = document.getElementById("fileId");
      const fileIdField   = document.getElementById("fileIdField");
      const checkCspEl    = document.getElementById("checkCsp");
      const showHeaderEl  = document.getElementById("showHeader");
      const showHeaderLbl = document.getElementById("showHeaderLabel");
      const initBtn       = document.getElementById("initBtn");
      const destroyBtn    = document.getElementById("destroyBtn");
      const clearBtn      = document.getElementById("clearBtn");
      const statusEl      = document.getElementById("status");
      const configLogEl   = document.getElementById("configLog");
      const eventLogEl    = document.getElementById("eventLog");

      let frameInstance = null;
      let loadWatchdog  = null;

      // Auto-fill file ID from demo session
      (function () {
        const demoFiles = window.__demoConfig?.session?.files;
        if (!demoFiles) return;
        const id = demoFiles.docx || demoFiles.xlsx || demoFiles.pptx || demoFiles.pdfForm || demoFiles.pdfTemplate;
        if (id) fileIdEl.value = String(id);
      })();

      function syncModeUI() {
        const isViewer = modeEl.value === "viewer";
        fileIdField.style.display = isViewer ? "" : "none";
        showHeaderEl.disabled = isViewer;
        showHeaderLbl.style.opacity = isViewer ? "0.4" : "";
      }

      modeEl.addEventListener("change", syncModeUI);
      syncModeUI();

      function setStatus(text) { statusEl.textContent = text; }

      function appendEvent(name, payload) {
        const time = new Date().toLocaleTimeString();
        let line = `[${time}] ${name}`;
        if (payload !== undefined) {
          try { line += "\n" + JSON.stringify(payload, null, 2); } catch { line += "\n" + String(payload); }
        }
        eventLogEl.value = line + "\n\n" + eventLogEl.value;
      }

      function stopWatchdog() {
        if (!loadWatchdog) return;
        clearTimeout(loadWatchdog);
        loadWatchdog = null;
      }

      function destroyFrame() {
        stopWatchdog();
        if (frameInstance && typeof frameInstance.destroyFrame === "function") {
          try { frameInstance.destroyFrame(); } catch {}
        }
        frameInstance = null;
        setStatus("Destroyed");
      }

      function initFrame() {
        const mode   = modeEl.value;
        const fileId = fileIdEl.value.trim();

        destroyFrame();
        setStatus("Initializing…");

        const events = {
          onAppReady:     (e) => { stopWatchdog(); setStatus("App ready");      appendEvent("onAppReady",     e ?? null); },
          onContentReady: (e) => { stopWatchdog(); setStatus("Content loaded"); appendEvent("onContentReady", e ?? null); },
          onNoAccess:     (e) => { stopWatchdog(); setStatus("No access");      appendEvent("onNoAccess",     e ?? null); },
          onNotFound:     (e) => { stopWatchdog(); setStatus("Not found");      appendEvent("onNotFound",     e ?? null); },
          onAppError:     (e) => { stopWatchdog(); setStatus("App error");      appendEvent("onAppError",     e ?? null); },
        };

        const base = { frameId: "ds-frame", width: "700px", height: "520px", theme: "base", checkCSP: checkCspEl.checked, events };

        if (mode === "viewer") {
          if (!fileId) {
            setStatus("File ID required");
            appendEvent("validation", { error: "Provide a file ID for viewer mode." });
            return;
          }
          const config = { ...base, id: fileId, showHeader: false, showTitle: true };
          configLogEl.value = JSON.stringify({ ...config, events: Object.keys(events) }, null, 2);
          loadWatchdog = setTimeout(() => {
            appendEvent("frameLoadTimeout", { message: "Frame did not load — possible CSP block. Check browser console." });
            setStatus("Possibly blocked by CSP");
            loadWatchdog = null;
          }, 3000);
          frameInstance = DocSpace.SDK.initViewer(config);
          appendEvent("initViewer", { id: fileId, checkCSP: base.checkCSP });
        } else {
          const config = { ...base, showHeader: showHeaderEl.checked, showMenu: true };
          configLogEl.value = JSON.stringify({ ...config, events: Object.keys(events) }, null, 2);
          loadWatchdog = setTimeout(() => {
            appendEvent("frameLoadTimeout", { message: "Frame did not load — possible CSP block. Check browser console." });
            setStatus("Possibly blocked by CSP");
            loadWatchdog = null;
          }, 3000);
          frameInstance = DocSpace.SDK.initManager(config);
          appendEvent("initManager", { checkCSP: base.checkCSP, showHeader: config.showHeader });
        }
      }

      initBtn.addEventListener("click", initFrame);
      destroyBtn.addEventListener("click", destroyFrame);
      clearBtn.addEventListener("click", () => {
        configLogEl.value = "";
        eventLogEl.value  = "";
        setStatus("Ready");
      });

      // Auto-init on load
      initFrame();
    </script>
  </body>
</html>
