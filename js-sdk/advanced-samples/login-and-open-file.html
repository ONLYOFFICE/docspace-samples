<!--
Example: Sign in and open file

This example demonstrates how to authenticate in DocSpace using a login form and
open files in an embedded manager and viewer without requiring a separate DocSpace login.

The SDK initializes a hidden system frame that handles password hashing and login.
After authentication, the manager opens and files can be previewed in the viewer.

Using methods:
- DocSpace.SDK.initSystem (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initsystem)
- system.getHashSettings (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#gethashsettings)
- system.createHash (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createhash)
- system.login (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#login)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- DocSpace.SDK.initViewer (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initviewer)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Sign In and Open File" />
    <meta name="example-description" content="Sign in with your DocSpace email and password, then browse files in the embedded manager and click any file to preview it in a side viewer." />
    <meta name="example-group" content="advanced" />
    <title>Sign In and Open File</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-login-and-open-file">

    <!-- Login section: centered card, hidden after sign-in -->
    <div id="loginSection" class="ex-login-and-open-file__login">
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto">
          <div class="field">
            <label for="usernameInput">Email</label>
            <input
              id="usernameInput"
              type="email"
              placeholder="user@example.com"
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="passwordInput">Password</label>
            <input
              id="passwordInput"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="signInBtn" type="button" class="btn">Sign in</button>
          <span id="status" class="status">Enter your credentials and click Sign in</span>
        </div>

        <!-- Shown when the browser blocks the session cookie -->
        <div id="cookieRetryRow" style="display:none">
          <button id="openPortalBtn" type="button" class="btn btn--secondary">Open DocSpace tab</button>
          <button id="retryManagerBtn" type="button" class="btn btn--secondary">Try again</button>
        </div>
      </div>
    </div>

    <!-- Frames section: shown after sign-in -->
    <div id="framesLayout" class="ex-login-and-open-file__frames" style="display:none">
      <div class="ex-login-and-open-file__row">
        <div class="frame-wrap" style="flex:1;min-width:0">
          <iframe id="manager-frame" title="Manager frame" allow="storage-access"></iframe>
        </div>
        <div id="viewerWrap" class="frame-wrap" style="flex:1;min-width:0;display:none">
          <iframe id="viewer-frame" title="Viewer frame" allow="storage-access"></iframe>
        </div>
      </div>
      <div class="bottom-bar">
        <span id="frameStatus" class="status">Opening manager…</span>
      </div>
    </div>

    <!-- Hidden system frame for SDK auth operations -->
    <div id="system-frame" style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden"></div>

    <script>
      const usernameInput  = document.getElementById("usernameInput");
      const passwordInput  = document.getElementById("passwordInput");
      const signInBtn      = document.getElementById("signInBtn");
      const statusEl       = document.getElementById("status");
      const frameStatusEl  = document.getElementById("frameStatus");
      const loginSection   = document.getElementById("loginSection");
      const framesLayout   = document.getElementById("framesLayout");
      const viewerWrap     = document.getElementById("viewerWrap");
      const cookieRetryRow = document.getElementById("cookieRetryRow");
      const openPortalBtn  = document.getElementById("openPortalBtn");
      const retryManagerBtn = document.getElementById("retryManagerBtn");

      let managerInstance = null;
      let viewerInstance  = null;
      let system          = null;

      // Auto-fill from demo session if available
      (function () {
        const s = window.__demoConfig?.session;
        if (!s) return;
        if (s?.user?.email)    usernameInput.value = String(s.user.email);
        if (s?.user?.password) passwordInput.value = String(s.user.password);
        if (usernameInput.value.trim() && passwordInput.value) setStatus("Ready");
      })();

      function setStatus(message) {
        statusEl.textContent      = message;
        frameStatusEl.textContent = message;
      }

      function destroyInstance(inst) {
        if (!inst || typeof inst.destroyFrame !== "function") return;
        try { inst.destroyFrame(); } catch {}
      }

      function openViewer(item) {
        destroyInstance(viewerInstance);
        viewerInstance = null;

        const title = item.title || item.name || item.fileTitle || "";
        setStatus("Opening: " + (title || "ID " + item.id));
        viewerWrap.style.display = "";

        viewerInstance = DocSpace.SDK.initViewer({
          frameId: "viewer-frame",
          id: String(item.id),
          width: "100%",
          height: "620px",
          theme: "base",
          showHeader: false,
          showTitle: true,
          events: {
            onAppReady:  () => setStatus("Viewer ready — " + (title || "ID " + item.id)),
            onNoAccess:  () => setStatus("No access to this file"),
            onNotFound:  () => setStatus("File not found"),
            onAppError:  () => setStatus("Viewer error")
          }
        });
      }

      function showCookieWarning() {
        const hostname = new URL("{PORTAL_SRC}").hostname;
        setStatus(
          "Sign-in succeeded but the browser blocked the session cookie. " +
          "Open DocSpace tab to log in at " + hostname + " directly, then click Try again."
        );
        cookieRetryRow.style.display = "flex";
      }

      function initManager() {
        destroyInstance(managerInstance);
        managerInstance = null;
        cookieRetryRow.style.display = "none";

        loginSection.style.display = "none";
        framesLayout.style.display = "";
        setStatus("Opening manager…");

        let contentLoaded    = false;
        let cookieWarningTimer = null;

        managerInstance = DocSpace.SDK.initManager({
          frameId: "manager-frame",
          width: "100%",
          height: "620px",
          theme: "base",
          events: {
            onAppReady: () => {
              cookieWarningTimer = setTimeout(() => {
                if (!contentLoaded) showCookieWarning();
              }, 5000);
            },
            onContentReady: () => {
              contentLoaded = true;
              clearTimeout(cookieWarningTimer);
              setStatus("Ready — click a file to preview it");
            },
            onFileManagerClick: (event) => {
              const item = event && typeof event === "object" ? event : null;
              if (!item || !item.id) return;
              openViewer(item);
            },
            onAppError: () => {
              clearTimeout(cookieWarningTimer);
              setStatus("Manager error");
            }
          }
        });
      }

      async function signIn() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) { setStatus("Enter email and password"); return; }

        signInBtn.disabled = true;
        setStatus("Signing in…");

        try {
          if (!system) {
            setStatus("Initializing SDK…");
            await initSystemAndWaitReady();
          }

          const hashSettings = await system.getHashSettings();
          const passwordHash = await system.createHash(password, hashSettings);
          await system.login(username, passwordHash);

          // Small delay so the browser can commit the session cookie to storage.
          await new Promise((r) => setTimeout(r, 300));

          setStatus("Signed in — opening manager…");
          initManager();
        } catch (err) {
          setStatus("Sign in failed: " + (err?.message || String(err)));
          signInBtn.disabled = false;
        }
      }

      function initSystemAndWaitReady() {
        return new Promise((resolve, reject) => {
          system = DocSpace.SDK.initSystem({
            frameId: "system-frame",
            theme: "base",
            events: {
              onAppReady: resolve,
              onAppError: (e) => reject(new Error(String(error?.message || e || "SDK init error")))
            }
          });
        });
      }

      openPortalBtn.addEventListener("click", () => window.open("{PORTAL_SRC}", "_blank"));
      retryManagerBtn.addEventListener("click", initManager);
      signInBtn.addEventListener("click", signIn);
      passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
    </script>
  </body>
</html>
