<!--
Example: Authorization

This examples logs in to the DocSpace account using the specified email and password hash.

Using methods:
- DocSpace.SDK.initSystem (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initsystem)
- system.getHashSettings (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#gethashsettings)
- system.createHash (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createhash)
- system.login (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#login)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Authorization" />
    <meta name="example-description" content="Log in to DocSpace using email + password (hashed via SDK)." />
    <meta name="example-group" content="advanced" />
    <title>Authorization</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.1.0/api.js"></script>
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-authorization">
    <div class="page">
      <div class="card">
        <div class="field">
          <label for="loginInput">Email</label>
          <input id="loginInput" type="email" placeholder="user@example.com" />
        </div>
        <div class="field">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••" />
        </div>
        <div class="actions">
          <button class="btn" id="btn" type="button">Login</button>
          <span class="status" id="status">Waiting…</span>
        </div>
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="out" readonly placeholder="SDK response will appear here…"></textarea>
        </div>
      </div>
    </div>

    <div style="display:none"><iframe id="ds-frame"></iframe></div>

    <script>
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const out = document.getElementById("out");

      function setOut(v) {
        try {
          out.value = typeof v === "string" ? v : JSON.stringify(v, null, 2);
        } catch {
          out.value = String(v);
        }
      }

      const system = DocSpace.SDK.initSystem({
        frameId: "ds-frame",
        theme: "base",
        events: {
          onAppReady: () => {
            status.textContent = "Ready";
          },
          onAppError: (e) => {
            status.className = "status err";
            status.textContent = "SDK error";
            setOut(e?.message || String(e));
          },
        },
      });

      btn.onclick = async () => {
        const login = document.getElementById("loginInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        if (!login || !password) return;

        btn.disabled = true;
        status.className = "status";
        status.textContent = "Logging in…";
        setOut("");

        try {
          const hs = await system.getHashSettings();
          const ph = await system.createHash(password, hs);
          const res = await system.login(login, ph);
          status.className = "status ok";
          status.textContent = "Done";
          setOut(res || { ok: true });
        } catch (e) {
          status.className = "status err";
          status.textContent = "Error";
          setOut(e?.message || String(e));
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
