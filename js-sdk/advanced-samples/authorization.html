<!--
Example: Authorization

This examples logs in to the DocSpace account using the specified email and password hash.

Using methods:
- DocSpace.SDK.initSystem (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initsystem)
- system.getHashSettings (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#gethashsettings)
- system.createHash (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createhash)
- system.login (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#login)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Log In to DocSpace" />
    <meta name="example-description" content="Enter your DocSpace email and password to authenticate. The SDK handles password hashing — no manual hash computation needed." />
    <meta name="example-group" content="advanced" />
    <title>Log In to DocSpace</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-authorization">
    <div class="page">
      <div class="card">
        <div class="field">
          <label for="loginInput">Email</label>
          <input id="loginInput" type="email" placeholder="user@example.com" />
        </div>
        <div class="field">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••" />
        </div>
        <div class="actions">
          <button class="btn" id="btn" type="button" disabled>Login</button>
          <span class="status" id="status">Waiting…</span>
        </div>
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="out" readonly placeholder="SDK response will appear here…"></textarea>
        </div>
      </div>
    </div>

    <div style="display:none"><iframe id="ds-frame"></iframe></div>

    <script>
      const btn = document.getElementById("btn");
      const loginInput = document.getElementById("loginInput");
      const passwordInput = document.getElementById("passwordInput");
      const status = document.getElementById("status");
      const out = document.getElementById("out");

      function updateButtonState() {
        const ok = loginInput.value.trim() && passwordInput.value;
        btn.disabled = !ok;
        if (ok) status.textContent = "Ready";
      }

      function applySession(session) {
        if (!session) return;
        if (session?.user?.email && !loginInput.value) loginInput.value = String(session.user.email);
        if (session?.user?.password && !passwordInput.value) passwordInput.value = String(session.user.password);
      }

      async function loadSessionFallback() {
        if (loginInput.value && passwordInput.value) return;
        try {
          const r = await fetch("/api/demo/status", { credentials: "same-origin" });
          const data = r.ok ? await r.json() : null;
          if (data?.active && data?.ready) {
            applySession(data?.session || null);
            updateButtonState();
            return;
          }
          const started = await fetch("/api/demo/start", { method: "POST", credentials: "same-origin" });
          if (!started.ok) return;
          const startData = await started.json();
          applySession(startData?.session || null);
          updateButtonState();
        } catch {}
      }

      // Auto-fill from demo session if available
      (async function () {
        applySession(window.__demoConfig?.session || null);
        updateButtonState();
        await loadSessionFallback();
      })();

      loginInput.addEventListener("input", updateButtonState);
      passwordInput.addEventListener("input", updateButtonState);

      function setOut(text) {
        try {
          out.value = typeof text === "string" ? text : JSON.stringify(text, null, 2);
        } catch {
          out.value = String(text);
        }
      }

      const system = DocSpace.SDK.initSystem({
        frameId: "ds-frame",
        theme: "base",
        events: {
          onAppReady: () => {
            updateButtonState();
          },
          onAppError: (e) => {
            status.className = "status err";
            status.textContent = "SDK error";
            setOut(error?.message || String(error));
          },
        },
      });

      btn.onclick = async () => {
        const login = loginInput.value.trim();
        const password = passwordInput.value;

        if (!login || !password) return;

        btn.disabled = true;
        status.className = "status";
        status.textContent = "Logging in…";
        setOut("");

        try {
          const hashSettings = await system.getHashSettings();
          const passwordHash = await system.createHash(password, hashSettings);
          const loginToken = await system.login(login, passwordHash);
          status.className = "status ok";
          status.textContent = "Done";
          setOut(loginToken || { ok: true });
        } catch (error) {
          status.className = "status err";
          status.textContent = "Error";
          setOut(error?.message || String(error));
        } finally {
          updateButtonState();
        }
      };
    </script>
  </body>
</html>
