<!--
Example: Project Manager Folder Integration

Create a project room with a predefined folder structure and navigate
the embedded manager into it.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createRoom (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createroom)
- manager.createFolder (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createfolder)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Project Room with Folder Structure" />
    <meta name="example-description" content="Create a project room, auto-generate a folder structure for it, and open the result in the embedded manager." />
    <meta name="example-group" content="advanced" />
    <title>Project Room with Folder Structure</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-project-manager-folder-integration">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <span class="status" id="status">Waiting…</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 320px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label for="title">Project title</label>
          <input id="title" type="text" placeholder="Website redesign" />
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="createBtn" class="btn" type="button" disabled>Create project</button>
        </div>

        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:10px">
          <label>Result</label>
          <textarea class="output" id="out" readonly
            style="flex:1;resize:none;font-family:ui-monospace,monospace;font-size:12px"
            placeholder="Room and folder IDs will appear here…"></textarea>
        </div>
      </div>
    </div>

    <script>
      const titleInput = document.getElementById("title");
      const createBtn  = document.getElementById("createBtn");
      const statusEl   = document.getElementById("status");
      const out        = document.getElementById("out");

      let managerReady = false;

      function setStatus(text) { statusEl.textContent = text; }
      function setOut(obj)  { out.value = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2); }
      function updateState() { createBtn.disabled = !managerReady || !titleInput.value.trim(); }

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => { managerReady = true; setStatus("Ready"); updateState(); },
          onAppError: () => setStatus("Error")
        }
      });

      titleInput.addEventListener("input", updateState);

      async function createFolders(roomId) {
        const structure = ["01 - Brief", "02 - Design", "03 - Development", "04 - Delivery"];
        const created = [];
        for (const name of structure) {
          try { created.push(await manager.createFolder(String(roomId), name)); } catch {}
        }
        return created;
      }

      createBtn.onclick = async () => {
        const title = titleInput.value.trim();
        if (!title) return;

        createBtn.disabled = true;
        setStatus("Creating…");
        setOut("");

        try {
          const room = await manager.createRoom(title, 2);
          if (!room?.id) throw new Error("Room was not created");

          const folders = await createFolders(room.id);

          manager.setConfig({
            rootPath: "/rooms/shared/" + room.id,
            filter: { folder: String(room.id) },
            showHeader: false
          });

          setStatus("Done");
          setOut({ room, folders });
        } catch (error) {
          setStatus("Error");
          setOut(error?.message || String(error) || "Failed");
        } finally {
          updateState();
        }
      };
    </script>
  </body>
</html>
