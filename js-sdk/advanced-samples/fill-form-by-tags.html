<!--
Example: Fill PDF form fields by key

Pick a fillable .pdf via the file selector, then click Fill & Save to fill
form fields by FormKey using executeInEditor in a hidden editor frame.

Using methods:
- DocSpace.SDK.initFileSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initfileselector)
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
- editor.executeInEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#executeInEditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Fill PDF Form Fields" />
    <meta name="example-description" content="Open a fillable PDF and automatically fill its fields by matching field names (FormKeys) to values — using the editor API in the background." />
    <meta name="example-group" content="advanced" />
    <title>Fill PDF Form Fields</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-fill-form-by-tags">
    <div class="result-split">
      <div class="result-split__frame">
        <!-- Step 1: file selector -->
        <div class="frame-wrap" id="selectorWrap">
          <iframe id="ds-selector"></iframe>
        </div>
        <!-- Step 2: editor shown after Fill & Save -->
        <div class="frame-wrap" id="editorWrap" style="display:none">
          <iframe id="ds-hidden-editor"></iframe>
        </div>
        <div class="bottom-bar">
          <button id="backBtn" type="button" class="btn btn--secondary" style="display:none">← Select another file</button>
          <span class="status" id="hint">Select a fillable .pdf</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 360px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected file ID</label>
          <input id="selectedId" type="text" readonly placeholder="— select a file —" />
        </div>

        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:10px">
          <label for="map">Fill map <span style="color:#9ca3af;font-weight:400">(JSON: FormKey → value)</span></label>
          <textarea id="map" style="flex:1;resize:none;font-family:ui-monospace,monospace;font-size:12px"></textarea>
        </div>

        <div class="actions" style="flex:0 0 auto;margin-top:12px">
          <button id="fill" type="button" class="btn" disabled>Fill &amp; Save</button>
          <button id="clearFields" type="button" class="btn btn--secondary" disabled>Clear fields</button>
          <span class="status" id="actionStatus"></span>
        </div>
      </div>
    </div>

    <script>
      const hint         = document.getElementById("hint");
      const selectedIdEl = document.getElementById("selectedId");
      const mapEl        = document.getElementById("map");
      const fill         = document.getElementById("fill");
      const clearFields  = document.getElementById("clearFields");
      const actionStatus = document.getElementById("actionStatus");
      const selectorWrap = document.getElementById("selectorWrap");
      const editorWrap   = document.getElementById("editorWrap");
      const backBtn      = document.getElementById("backBtn");

      let editorInstance = null;
      let selected = null;

      function setHint(text)   { hint.textContent = text; }
      function setStatus(text) { actionStatus.textContent = text; }

      function showSelector() {
        selectorWrap.style.display = "";
        editorWrap.style.display   = "none";
        backBtn.style.display      = "none";
      }

      function showEditor() {
        selectorWrap.style.display = "none";
        editorWrap.style.display   = "";
        backBtn.style.display      = "";
      }

      function updateUI() {
        selectedIdEl.value = selected?.id ? String(selected.id) : "";
        const ok = !!selected?.id;
        fill.disabled        = !ok;
        clearFields.disabled = !ok;
      }

      function destroyEditor() {
        if (editorInstance && typeof editorInstance.destroyFrame === "function") {
          try { editorInstance.destroyFrame(); } catch {}
        }
        editorInstance = null;
      }

      function parseMap() {
        const raw = String(mapEl.value || "").trim();
        if (!raw) return {};
        const v = JSON.parse(raw);
        if (!v || typeof v !== "object" || Array.isArray(v)) throw new Error("Fill map must be a JSON object");
        return v;
      }

      // File selector
      DocSpace.SDK.initFileSelector({
        frameId: "ds-selector",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            const id = item?.id ?? null;
            if (!id) return;
            selected = { id: String(id), title: item?.title || item?.name || `File ${id}` };
            setHint(`Selected: ${selected.title}`);
            setStatus("");
            updateUI();
          },
          onAppError: () => setHint("Selector error")
        }
      });

      backBtn.onclick = () => {
        destroyEditor();
        showSelector();
        setHint(selected ? `Selected: ${selected.title}` : "Select a fillable .pdf");
        setStatus("");
      };

      function buildFillByTagsCommand(map) {
        const payload = JSON.stringify(map || {});
        return new Function(
          "editorInstance",
          `try {
            const map = ${payload};
            const connector = editorInstance?.createConnector?.();
            if (!connector?.callCommand) return;

            Asc.scope.map = map;

            function toBool(value) {
              if (typeof value === "boolean") return value;
              const s = String(value ?? "").trim().toLowerCase();
              return s === "true" || s === "1" || s === "yes" || s === "y" || s === "on";
            }

            connector.callCommand(function () {
              try {
                const doc = Api.GetDocument && Api.GetDocument();
                if (!doc || typeof doc.GetAllForms !== "function") return;

                const forms = doc.GetAllForms() || [];
                const map   = Asc.scope.map || {};

                const keys = Object.keys(map);
                for (let i = 0; i < keys.length; i++) {
                  const key   = String(keys[i]);
                  const value = map[key];
                  let found   = false;

                  for (let j = 0; j < forms.length; j++) {
                    const form = forms[j];
                    if (!form || typeof form.GetFormKey !== "function") continue;
                    if (String(form.GetFormKey()) !== key) continue;
                    found = true;
                    try {
                      const type = String((typeof form.GetFormType === "function" && form.GetFormType()) || "");
                      if      (type === "checkBoxForm"   && typeof form.SetChecked  === "function") form.SetChecked(toBool(value));
                      else if (type === "dateForm"       && typeof form.SetDate     === "function") form.SetDate(value == null ? "" : String(value));
                      else if (type === "pictureForm"    && typeof form.SetImage    === "function") form.SetImage(value == null ? "" : String(value));
                      else if (typeof form.SetText === "function") form.SetText(value == null ? "" : String(value));
                    } catch (error) { console.error("Failed to fill", key, error); }
                  }
                  if (!found) console.warn("No PDF form found for key:", key);
                }
                Api.Save();
              } catch (error) { console.error("Fill command failed", error); }
            });
          } catch (error) { console.error("executeInEditor build failed", error); }`
        );
      }

      function buildClearAllFieldsCommand() {
        return new Function(
          "editorInstance",
          `try {
            const connector = editorInstance?.createConnector?.();
            if (!connector?.callCommand) return;
            connector.callCommand(function () {
              try {
                const doc = Api.GetDocument && Api.GetDocument();
                if (!doc) return;
                if (typeof doc.GetAllForms === "function") {
                  const forms = doc.GetAllForms() || [];
                  for (let i = 0; i < forms.length; i++) {
                    const form = forms[i];
                    if (!form) continue;
                    try {
                      if (typeof form.Clear === "function") { form.Clear(); continue; }
                      const type = String((typeof form.GetFormType === "function" && form.GetFormType()) || "");
                      if      (type === "checkBoxForm"   && typeof form.SetChecked === "function") form.SetChecked(false);
                      else if (type === "dateForm"       && typeof form.SetDate    === "function") form.SetDate("");
                      else if (typeof form.SetText === "function") form.SetText("");
                    } catch (error) { console.error("Failed to clear form", error); }
                  }
                } else if (typeof doc.ClearAllFields === "function") {
                  doc.ClearAllFields();
                }
                Api.Save();
              } catch (error) { console.error("Clear command failed", error); }
            });
          } catch (error) { console.error("executeInEditor build failed", error); }`
        );
      }

      function runInEditor(command, taskLabel) {
        if (!selected?.id) return;
        destroyEditor();
        fill.disabled        = true;
        clearFields.disabled = true;
        setStatus(taskLabel + "…");
        showEditor();
        setHint("Loading editor…");

        editorInstance = DocSpace.SDK.initEditor({
          id: selected.id,
          frameId: "ds-hidden-editor",
          width: "700px",
          height: "520px",
          theme: "base",
          events: {
            onAppReady: () => {
              setHint("Executing command…");
              const frame = DocSpace?.SDK?.frames?.["ds-hidden-editor"];
              if (!frame || typeof frame.executeInEditor !== "function") {
                setStatus("executeInEditor not available");
                setHint("Error");
                fill.disabled        = false;
                clearFields.disabled = false;
                return;
              }
              try {
                frame.executeInEditor(command);
                setStatus("Done");
                setHint("Saved");
              } catch (error) {
                setStatus("Execute failed: " + (error?.message || String(error)));
              }
              fill.disabled        = false;
              clearFields.disabled = false;
            },
            onAppError: (e) => {
              setStatus("Editor error");
              setHint("Error");
              destroyEditor();
              showSelector();
              fill.disabled        = false;
              clearFields.disabled = false;
            }
          }
        });
      }

      fill.onclick = () => {
        let map;
        try { map = parseMap(); }
        catch (error) { setStatus(error?.message || "Invalid JSON"); return; }
        runInEditor(buildFillByTagsCommand(map), "Filling");
      };

      clearFields.onclick = () => {
        runInEditor(buildClearAllFieldsCommand(), "Clearing");
      };

      mapEl.value = JSON.stringify(
        { FirstName: "Alice", LastName: "Smith", Agree: true, BirthDate: "1998-03-01", Department: "Sales" },
        null, 2
      );
      updateUI();
    </script>
  </body>
</html>
