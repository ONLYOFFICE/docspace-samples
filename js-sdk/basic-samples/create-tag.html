<!--
Example: Create tag

Tags are labels you can attach to rooms for filtering and organization.
Create tags here, then apply them to rooms via the "Add Tags to Room" example.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createTag (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createtag)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Create Tag" />
    <meta
      name="example-description"
      content="Tags are labels you can attach to rooms for filtering and organization. Create tags here, then apply them via Add Tags to Room."
    />
    <meta name="example-group" content="basic" />
    <title>Create Tag</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-create-tag">
    <!-- Hidden manager frame for executing SDK methods -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-manager-frame"></div>
    </div>

    <div class="page">
      <div class="card">
        <p style="margin:0 0 16px;font-size:13px;color:#6b7280;line-height:1.6">
          Tags are labels you can attach to rooms for quick filtering and organization.
          Create tags here, then apply them to a room using the
          <strong>Add Tags to Room</strong> example.
        </p>

        <div class="field">
          <label for="tagName">Tag name</label>
          <input id="tagName" type="text" placeholder="e.g. marketing" autocomplete="off" />
        </div>

        <div class="actions">
          <button class="btn" id="createBtn" type="button" disabled>Create Tag</button>
          <button class="btn secondary" id="autoBtn" type="button" disabled>Generate name</button>
          <span class="status" id="status">Preparing SDK…</span>
        </div>

        <div id="tagsWrap" style="display:none;margin-top:20px">
          <label style="display:block;margin-bottom:8px;font-weight:600;font-size:13px">
            Created in this session
          </label>
          <div id="tagsList" style="display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>
      </div>
    </div>

    <script>
      const tagNameEl = document.getElementById("tagName");
      const createBtn = document.getElementById("createBtn");
      const autoBtn   = document.getElementById("autoBtn");
      const status    = document.getElementById("status");
      const tagsWrap  = document.getElementById("tagsWrap");
      const tagsList  = document.getElementById("tagsList");

      let sdkReady = false;

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-manager-frame",
        width: "0",
        height: "0",
        theme: "base",
        events: {
          onAppReady: () => {
            sdkReady = true;
            autoBtn.disabled = false;
            updateCreateState();
            status.textContent = "SDK ready.";
          },
          onAppError: () => {
            status.textContent = "SDK error — check portal URL";
          }
        }
      });

      function updateCreateState() {
        createBtn.disabled = !sdkReady || !(tagNameEl.value || "").trim();
      }

      function addTagChip(name) {
        const chip = document.createElement("span");
        chip.textContent = name;
        chip.style.cssText = [
          "display:inline-flex;align-items:center;padding:4px 12px",
          "border-radius:999px;font-size:13px;font-weight:600",
          "background:rgba(0,115,230,.08);color:#0058c7",
          "border:1px solid rgba(0,115,230,.25)",
        ].join(";");
        tagsList.appendChild(chip);
        tagsWrap.style.display = "";
      }

      autoBtn.onclick = () => {
        tagNameEl.value = "tag-" + Math.random().toString(36).slice(2, 8);
        updateCreateState();
      };

      tagNameEl.addEventListener("input", updateCreateState);

      createBtn.onclick = async () => {
        const name = (tagNameEl.value || "").trim();
        if (!sdkReady || !name) return;

        createBtn.disabled = true;
        status.textContent = "Creating…";

        try {
          await manager.createTag(name);
          addTagChip(name);
          tagNameEl.value = "";
          updateCreateState();
          status.textContent = "Done.";
        } catch (error) {
          status.textContent = "Failed: " + (error?.message || String(error));
          updateCreateState();
        }
      };
    </script>
  </body>
</html>
