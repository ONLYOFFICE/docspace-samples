<!--
Example: Get config

This example demonstrates how to retrieve the configuration object of the embedded frame.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.getConfig (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getconfig)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get Config" />
    <meta
      name="example-description"
      content="Retrieve and display the configuration object of the embedded DocSpace frame."
    />
    <meta name="example-group" content="basic" />
    <title>Get Config</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-get-config">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button class="btn" id="getBtn" type="button" disabled>Get Config</button>
          <span class="status" id="status">Loading SDK…</span>
        </div>
      </div>
      <div class="result-split__panel card">
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="output" readonly placeholder="Result will appear here…"></textarea>
        </div>
      </div>
    </div>

    <script>
      const getBtn = document.getElementById("getBtn");
      const status = document.getElementById("status");
      const output = document.getElementById("output");

      let sdkReady = false;

      const docSpace = DocSpace.SDK.initManager({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => {
            sdkReady = true;
            getBtn.disabled = false;
            status.textContent = "Frame is ready.";
          },
          onAppError: () => {
            status.textContent = "SDK error — check portal URL";
          }
        }
      });

      getBtn.onclick = async () => {
        if (!sdkReady) return;

        status.textContent = "Fetching config…";
        output.value = "";

        try {
          const config = await docSpace.getConfig();
          output.value = JSON.stringify(config, null, 2);
          status.textContent = "Done.";
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
        }
      };
    </script>
  </body>
</html>
