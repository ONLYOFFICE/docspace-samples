<!--
Example: Initialize system

This example demonstrates how to initialize the DocSpace system interface using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initSystem (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initsystem)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Init System" />
    <meta name="example-description" content="Initialize a hidden system frame used for background SDK operations like login, hash generation, and API calls." />
    <meta name="example-group" content="basic" />
    <title>Init System</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-init-system">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button class="btn" id="btn" type="button">Init system</button>
          <span class="status" id="status">Ready</span>
        </div>
      </div>
      <div class="result-split__panel card" style="flex:0 0 360px;min-height:520px">
        <div class="field">
          <label>SDK Config</label>
          <textarea class="output" id="configOut" readonly></textarea>
        </div>
      </div>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");

      const config = {
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base"
      };

      document.getElementById("configOut").value = JSON.stringify(config, null, 2);

      btn.onclick = async () => {
        status.textContent = "Initializing…";
        btn.disabled = true;
        try {
          await DocSpace.SDK.initSystem(config);
          status.textContent = "Done";
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
