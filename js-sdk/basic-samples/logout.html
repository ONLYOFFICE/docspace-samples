<!--
Example: Logout

This example demonstrates how to log out a user from the DocSpace session using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.logout (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#logout)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Logout" />
    <meta name="example-description" content="Log out from the current DocSpace session." />
    <meta name="example-group" content="basic" />
    <title>Logout</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-logout">
    <div class="page">
      <div class="card">
        <div class="actions">
          <button class="btn" id="btn" type="button">Logout</button>
          <span class="status" id="status">Ready</span>
        </div>
      </div>
    </div>

    <!-- Hidden frame for SDK method calls -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-frame"></div>
    </div>

    <script>
      const btn = document.getElementById("btn");

      const status = document.getElementById("status");

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-frame",
        width: "900px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => { status.textContent = "Ready"; },
          onAppError: () => { status.textContent = "SDK error — check portal URL"; }
        }
      });

      btn.onclick = async () => {
        try {
          await manager.logout();
          status.textContent = "Done";
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
        }
      };
    </script>
  </body>
</html>
