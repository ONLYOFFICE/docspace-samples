<!--
Example: Get folder info

This example demonstrates how to retrieve information about the current folder in DocSpace using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.getFolderInfo (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getfolderinfo)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get Folder Info" />
    <meta name="example-description" content="Select a room and retrieve metadata about the current folder: title, ID, type, and more." />
    <meta name="example-group" content="basic" />
    <title>Get Folder Info</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-get-folder-info">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <!-- Hidden manager frame for executing SDK methods -->
        <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
          <div id="ds-manager-frame"></div>
        </div>
        <div class="bottom-bar">
          <span class="status" id="hint">Select a room</span>
          <button class="btn" id="btn" type="button" disabled>Get Folder Info</button>
        </div>
      </div>
      <div class="result-split__panel card">
        <div id="err" class="err-line"></div>
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="out" readonly placeholder="Select a room, then click Get Folder Info…"></textarea>
        </div>
      </div>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const hint = document.getElementById("hint");
      const err = document.getElementById("err");
      const out = document.getElementById("out");

      let roomId = null;
      let manager = null;

      // 1) UI: user selects a room
      DocSpace.SDK.initRoomSelector({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            roomId = item?.id ? String(item.id).trim() : null;
            if (!roomId) {
              btn.disabled = true;
              hint.textContent = "Select a room";
              err.textContent = "Room ID is missing in selection payload.";
              return;
            }

            err.textContent = "";
            out.value = "";

            initManagerForRoom(roomId);
          }
        }
      });

      // 2) Background: manager re-initialized for the selected room
      function initManagerForRoom(id) {
        btn.disabled = true;
        hint.textContent = "Preparing…";

        if (manager && typeof manager.destroyFrame === "function") {
          try { manager.destroyFrame(); } catch {}
        }

        manager = DocSpace.SDK.initManager({
          frameId: "ds-manager-frame",
          width: "0",
          height: "0",
          theme: "base",
          rootPath: "/rooms/shared/" + String(id),
          filter: { folder: String(id) },
          events: {
            onAppReady: () => {
              btn.disabled = false;
              hint.textContent = "Ready";
            },
            onAppError: (e) => {
              btn.disabled = true;
              hint.textContent = "Error";
              err.textContent = error?.message || "Manager init failed.";
            }
          }
        });
      }

      btn.onclick = async () => {
        if (!roomId || !manager) return;

        btn.disabled = true;
        hint.textContent = "Loading…";
        err.textContent = "";
        out.value = "";

        try {
          const info = await manager.getFolderInfo();
          out.value = JSON.stringify(info, null, 2);
          hint.textContent = "Done";
        } catch (error) {
          hint.textContent = "Error";
          err.textContent = error?.message || "Failed to get folder info.";
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
