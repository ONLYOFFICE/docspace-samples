<!--
Example: Initialize room selector

This example demonstrates how to embed the room selection interface using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Init Room Selector" />
    <meta name="example-description" content="Embed the DocSpace room selector — let users pick a room from their available list." />
    <meta name="example-group" content="basic" />
    <title>Init Room Selector</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-init-room-selector">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
      </div>
      <div class="result-split__panel card" style="flex:0 0 360px;min-height:520px;display:flex;flex-direction:column">
        <div class="field">
          <label>SDK Config</label>
          <textarea class="output" id="configOut" readonly></textarea>
        </div>
        <div class="field" style="margin-top:12px">
          <label>Selected room</label>
          <textarea class="output" id="selectionOut" readonly placeholder="Selected room data will appear here…"></textarea>
        </div>
      </div>
    </div>

    <script>
const selectionOut = document.getElementById("selectionOut");

const config = {
  frameId: "ds-frame",
  width: "700px",
  height: "520px",
  theme: "base",
  events: {
    onSelectCallback: (data) => {
      selectionOut.value = JSON.stringify(data, null, 2);
    },
    onAppError: (e) => {
      selectionOut.value = "SDK error — check portal URL\n" + (error?.message || String(e || ""));
    }
  }
};

document.getElementById("configOut").value = JSON.stringify(
  config, (k, v) => typeof v === "function" ? "[Function]" : v, 2
);

DocSpace.SDK.initRoomSelector(config);
    </script>
  </body>
</html>
