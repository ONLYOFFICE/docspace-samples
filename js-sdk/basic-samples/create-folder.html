<!--
Example: Create folder

Select a room, type a folder name, and create it. The room opens immediately so you can see the new folder.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- manager.createFolder (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createfolder)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Create Folder" />
    <meta
      name="example-description"
      content="Select a room, enter a folder name, create it — and the room opens so you can see the new folder right away."
    />
    <meta name="example-group" content="basic" />
    <title>Create Folder</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-create-folder">

    <!-- Step 1: room selector -->
    <div id="selectorWrap">
      <div class="frame-wrap">
        <iframe id="ds-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <input id="folderName" type="text" placeholder="New Folder" autocomplete="off" />
        <button class="btn" id="button" type="button" disabled>Create Folder</button>
        <span class="status" id="status">Select a room</span>
      </div>
    </div>

    <!-- Step 2: manager showing the room after creation -->
    <div id="managerWrap" style="display:none">
      <div class="frame-wrap">
        <iframe id="manager-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <button class="btn secondary" onclick="showSelector()">← Create another</button>
        <span class="status" id="managerStatus">Opening room…</span>
      </div>
    </div>

    <!-- Hidden manager frame for executing SDK methods -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-manager-frame"></div>
    </div>

    <script>
      const button = document.getElementById("button");
      const input  = document.getElementById("folderName");
      const status = document.getElementById("status");

      let targetId     = null;
      let managerReady = false;

      function extractId(data) {
        const item = Array.isArray(data) ? data[0] : data;
        return item?.id ? String(item.id).trim() : null;
      }

      function updateButtonState() {
        button.disabled = !managerReady || !targetId || !input.value.trim();
      }

      function showSelector() {
        document.getElementById("managerWrap").style.display  = "none";
        document.getElementById("selectorWrap").style.display = "";
        input.value = "";
        updateButtonState();
      }

      DocSpace.SDK.initRoomSelector({
        frameId: "ds-frame",
        width: "960px",
        height: "600px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            targetId = extractId(data);
            status.textContent = targetId ? "Room selected" : "Select a room";
            updateButtonState();
          }
        }
      });

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-manager-frame",
        width: "0",
        height: "0",
        theme: "base",
        events: {
          onAppReady: () => {
            managerReady = true;
            updateButtonState();
          },
          onAppError: () => {
            status.textContent = "Manager error — check portal URL";
            updateButtonState();
          }
        }
      });

      input.addEventListener("input", updateButtonState);

      button.onclick = async () => {
        const name = input.value.trim();
        if (!name) return;

        button.disabled = true;
        status.textContent = "Creating…";

        try {
          const created = await manager.createFolder(String(targetId), name);
          const folderId = String(created?.id || "").trim();
          if (!folderId) throw new Error("Folder ID is missing in createFolder response.");
          if (typeof window.__demoTrack === "function") {
            window.__demoTrack('folder', folderId); // demo only — replace with your own folder ID handling
          }

          document.getElementById("selectorWrap").style.display  = "none";
          document.getElementById("managerWrap").style.display   = "";

          DocSpace.SDK.initManager({
            frameId: "manager-frame",
            id:      String(targetId),
            width:   "960px",
            height:  "600px",
            events: {
              onAppReady: () => {
                document.getElementById("managerStatus").textContent = "Folder created — room contents below";
              },
              onAppError: () => {
                document.getElementById("managerStatus").textContent = "Manager failed to load";
              }
            }
          });
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
