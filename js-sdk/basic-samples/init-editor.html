<!--
Example: Initialize editor

This example demonstrates how to open a document in the ONLYOFFICE DocSpace editor using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Init Editor" />
    <meta name="example-description" content="Enter a file ID to open the file in the embedded ONLYOFFICE editor." />
    <meta name="example-group" content="basic" />
    <title>Init Editor</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-init-editor">

    <!-- Step 1: input form (shown before opening) -->
    <div id="inputWrap" class="page">
      <div class="card">
        <div class="field">
          <label for="fileId">File ID</label>
          <input id="fileId" type="text" placeholder="e.g. 123456" autocomplete="off" />
        </div>
        <div class="actions" style="margin-top:12px">
          <button class="btn" id="openBtn" type="button" disabled>Open in Editor</button>
          <span class="status" id="status">Enter a file ID</span>
        </div>
      </div>
    </div>

    <!-- Step 2: editor frame (shown after clicking Open) -->
    <div id="editorWrap" style="display:none">
      <div class="editor-host">
        <iframe id="ds-frame"></iframe>
      </div>
      <div class="page" style="padding-top:0;padding-bottom:0">
        <div class="card">
          <div class="field">
            <label>SDK Config</label>
            <textarea class="output" id="configOut" readonly></textarea>
          </div>
        </div>
      </div>
      <div class="bottom-bar">
        <button class="btn secondary" onclick="showInput()">← Open another</button>
        <span class="status" id="editorStatus">Opening…</span>
      </div>
    </div>

    <script>
      const input      = document.getElementById("fileId");
      const btn        = document.getElementById("openBtn");
      const status     = document.getElementById("status");
      const inputWrap  = document.getElementById("inputWrap");
      const editorWrap = document.getElementById("editorWrap");

      // Auto-fill from demo session if available
      (function () {
        const demoFiles = window.__demoConfig?.session?.files;
        if (demoFiles) {
          const id = demoFiles.docx || demoFiles.xlsx || demoFiles.pptx || demoFiles.pdfForm || demoFiles.pdfTemplate;
          if (id) { input.value = id; btn.disabled = false; status.textContent = "Ready"; }
        }
      })();

      function showInput() {
        editorWrap.style.display = "none";
        inputWrap.style.display  = "";
      }

      input.addEventListener("input", () => {
        const fileId = input.value.trim();
        btn.disabled = !fileId;
        status.textContent = fileId ? "Ready" : "Enter a file ID";
      });

      btn.onclick = () => {
        const id = input.value.trim();
        if (!id) return;

        inputWrap.style.display  = "none";
        editorWrap.style.display = "";

        const config = {
          id: id,
          frameId: "ds-frame",
          width: "100%",
          height: "600px",
          theme: "base",
          events: {
            onAppReady: () => {
              document.getElementById("editorStatus").textContent = "Ready";
            },
            onAppError: (e) => {
              document.getElementById("editorStatus").textContent = error?.message || "Failed to open file";
            },
          },
        };

        document.getElementById("configOut").value = JSON.stringify(
          config, (k, v) => typeof v === "function" ? "[Function]" : v, 2
        );

        DocSpace.SDK.initEditor(config);
      };
    </script>
  </body>
</html>
