<!--
Example: Initialize editor

This example demonstrates how to open a document in the ONLYOFFICE DocSpace editor using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initEditor (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initeditor)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Init editor" />
    <meta name="example-description" content="Enter a file ID and open it in the DocSpace editor using the JavaScript SDK." />
    <meta name="example-group" content="basic" />
    <title>Init Editor</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.1.0/api.js"></script>
    <script>
      (function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-init-editor">
    <div class="top-bar">
      <div class="field">
        <label for="fileId">File ID</label>
        <input id="fileId" type="text" placeholder="e.g. 123456" />
      </div>
      <button class="btn" id="openBtn" type="button" disabled>Open</button>
      <span class="status" id="status">Enter a file ID</span>
    </div>

    <div class="frame-wrap">
      <iframe id="ds-frame"></iframe>
    </div>

    <script>
      const input = document.getElementById("fileId");
      const btn = document.getElementById("openBtn");
      const status = document.getElementById("status");

      input.addEventListener("input", () => {
        const v = input.value.trim();
        btn.disabled = !v;
        status.className = "status";
        status.textContent = v ? "Ready" : "Enter a file ID";
      });

      btn.onclick = () => {
        const id = input.value.trim();
        if (!id) return;

        status.className = "status";
        status.textContent = "Opening…";

        DocSpace.SDK.initEditor({
          id: id,
          frameId: "ds-frame",
          width: "900px",
          height: "520px",
          theme: "base",
          events: {
            onAppReady: () => {
              status.className = "status ok";
              status.textContent = "Ready";
            },
            onAppError: (e) => {
              status.className = "status err";
              status.textContent = e?.message || "Failed to open file";
            },
          },
        });
      };
    </script>
  </body>
</html>
