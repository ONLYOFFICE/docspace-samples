<!--
Example: Get folders

This example demonstrates how to retrieve a list of folders from a shared DocSpace room using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.getFolders (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getfolders)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get Folders" />
    <meta name="example-description" content="Select a room and retrieve the list of folders inside it." />
    <meta name="example-group" content="basic" />
    <title>Get Folders</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-get-folders">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <!-- Hidden manager frame for executing SDK methods -->
        <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
          <div id="ds-manager-frame"></div>
        </div>
        <div class="bottom-bar">
          <span class="status" id="hint">Select a room</span>
          <button class="btn" id="btn" type="button" disabled>Get Folders</button>
        </div>
      </div>
      <div class="result-split__panel card">
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="raw" readonly placeholder="Select a room, then click Get Folders…"></textarea>
        </div>
        <div id="count" class="count-line"></div>
      </div>
    </div>

    <script>
      const btn = document.getElementById("btn");
      const hint = document.getElementById("hint");
      const raw = document.getElementById("raw");
      const count = document.getElementById("count");

      let roomId = null;
      let manager = null;
      let managerReady = false;

      function resetOutput() {
        raw.value = "";
        count.textContent = "";
      }

      function setState(text, enabled) {
        hint.textContent = text;
        btn.disabled = !enabled;
      }

      function destroyPrevManager() {
        if (manager && typeof manager.destroyFrame === "function") {
          try { manager.destroyFrame(); } catch {}
        }
      }

      function initManagerForRoom(id) {
        managerReady = false;
        setState("Preparing…", false);
        destroyPrevManager();

        manager = DocSpace.SDK.initManager({
          frameId: "ds-manager-frame",
          width: "0",
          height: "0",
          theme: "base",
          rootPath: "/rooms/shared/" + String(id),
          filter: { folder: String(id) },
          events: {
            onAppReady: () => {
              managerReady = true;
              setState("Ready", !!roomId);
            },
            onAppError: (e) => {
              managerReady = false;
              setState("Error", false);
              raw.value = error?.message || String(error);
            }
          }
        });
      }

      // Visible selector
      DocSpace.SDK.initRoomSelector({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            roomId = item?.id ? String(item.id).trim() : null;
            resetOutput();

            if (!roomId) {
              raw.value = "Room ID is missing in selection payload.";
              setState("Select a room", false);
              return;
            }

            initManagerForRoom(roomId);
          }
        }
      });

      btn.onclick = async () => {
        if (!roomId || !manager || !managerReady) return;

        btn.disabled = true;
        hint.textContent = "Loading…";
        resetOutput();

        try {
          const folders = await manager.getFolders();
          if (!Array.isArray(folders)) throw new Error("getFolders() returned non-array data.");
          raw.value = JSON.stringify(folders, null, 2);
          count.textContent = folders.length ? `Found: ${folders.length}` : "No folders found.";
          hint.textContent = "Done";
        } catch (error) {
          hint.textContent = "Error";
          raw.value = error?.message || String(error);
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
