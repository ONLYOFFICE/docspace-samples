<!--
Example: Remove tags from room

Select a room in the selector, enter the tag names to remove, then click Remove Tags.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.removeTagsFromRoom (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#removetagsfromroom)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Remove Tags from Room" />
    <meta name="example-description" content="Select a room and remove one or more of its tags." />
    <meta name="example-group" content="basic" />
    <title>Remove Tags from Room</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-remove-tags-from-room">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <span class="status" id="hint">Select a room</span>
        </div>
      </div>

      <div class="result-split__panel card" style="flex:0 0 320px;min-height:520px">
        <div class="field" style="flex:0 0 auto">
          <label>Selected room ID</label>
          <input id="roomIdDisplay" type="text" readonly placeholder="— select a room —" />
        </div>
        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label>Current tags</label>
          <input id="currentTagsDisplay" type="text" readonly placeholder="— select a room first —" />
        </div>
        <div class="field" style="flex:0 0 auto;margin-top:10px">
          <label for="tagsInput">Tags to remove <span style="color:#9ca3af;font-weight:400">(comma-separated)</span></label>
          <input id="tagsInput" type="text" placeholder="e.g. important, team-docs" />
        </div>
        <div class="actions" style="margin-top:12px">
          <button class="btn" id="removeBtn" type="button" disabled>Remove Tags</button>
          <span class="status" id="actionStatus"></span>
        </div>
        <div class="field" style="flex:1;display:flex;flex-direction:column;margin-top:12px">
          <label>Result</label>
          <textarea class="output" id="resultOut" readonly style="flex:1;resize:none" placeholder="Result will appear here…"></textarea>
        </div>
      </div>
    </div>

    <!-- Hidden manager frame for executing SDK methods -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-manager-frame"></div>
    </div>

    <script>
      const hint              = document.getElementById("hint");
      const roomIdDisplay     = document.getElementById("roomIdDisplay");
      const currentTagsDisplay = document.getElementById("currentTagsDisplay");
      const tagsInput         = document.getElementById("tagsInput");
      const removeBtn         = document.getElementById("removeBtn");
      const actionStatus      = document.getElementById("actionStatus");
      const resultOut         = document.getElementById("resultOut");

      let roomId       = null;
      let managerReady = false;

      function updateUI() {
        const hasTags = tagsInput.value.trim().length > 0;
        removeBtn.disabled = !roomId || !managerReady || !hasTags;
        if (!roomId)            hint.textContent = "Select a room";
        else if (!managerReady) hint.textContent = "Loading…";
        else                    hint.textContent = "Ready";
      }

      tagsInput.addEventListener("input", updateUI);

      // 1) Room selector
      DocSpace.SDK.initRoomSelector({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            roomId = item?.id ? String(item.id).trim() : null;
            roomIdDisplay.value = roomId ? String(roomId) : "";
            const tags = Array.isArray(item?.tags) ? item.tags : [];
            currentTagsDisplay.value = tags.length ? tags.join(", ") : "(no tags)";
            actionStatus.textContent = "";
            resultOut.value = "";
            updateUI();
          }
        }
      });

      // 2) Background manager for SDK method calls
      const manager = DocSpace.SDK.initManager({
        frameId: "ds-manager-frame",
        width: "0",
        height: "0",
        theme: "base",
        events: {
          onAppReady: () => {
            managerReady = true;
            updateUI();
          },
          onAppError: () => {
            hint.textContent = "SDK error — check portal URL";
          }
        }
      });

      removeBtn.onclick = async () => {
        if (!roomId || !managerReady) return;

        const tags = tagsInput.value
          .split(",")
          .map(t => t.trim())
          .filter(Boolean);

        if (!tags.length) return;

        removeBtn.disabled = true;
        actionStatus.textContent = "Removing…";
        resultOut.value = "";

        try {
          await manager.removeTagsFromRoom(String(roomId), tags);
          actionStatus.textContent = "Done";
          resultOut.value = JSON.stringify({ roomId, removedTags: tags }, null, 2);
          // Update displayed tags by removing the ones we just deleted
          const prev = currentTagsDisplay.value === "(no tags)" ? [] : currentTagsDisplay.value.split(", ");
          const updated = prev.filter(t => !tags.includes(t));
          currentTagsDisplay.value = updated.length ? updated.join(", ") : "(no tags)";
        } catch (error) {
          actionStatus.textContent = "Error";
          resultOut.value = error?.message || String(error);
        } finally {
          updateUI();
        }
      };
    </script>
  </body>
</html>
