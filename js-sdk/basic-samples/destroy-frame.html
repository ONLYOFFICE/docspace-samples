<!--
Example: Destroy frame

This example demonstrates how to destroy (remove) the embedded DocSpace iframe using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.destroyFrame (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#destroyframe)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Destroy Frame" />
    <meta name="example-description" content="Remove the embedded DocSpace iframe from the page and clean up the SDK instance." />
    <meta name="example-group" content="basic" />
    <title>Destroy Frame</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-destroy-frame">

    <!-- Active: frame + bottom bar -->
    <div id="activeWrap">
      <div class="frame-wrap">
        <iframe id="ds-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <button class="btn" id="destroyBtn" type="button" disabled>Destroy Frame</button>
        <span class="status" id="status">Loading SDK…</span>
      </div>
    </div>

    <!-- Destroyed: centered message -->
    <div class="page" id="destroyedWrap" style="display:none">
      <div class="card" style="text-align:center;padding:40px 24px">
        <div style="font-size:40px;margin-bottom:12px">🗑️</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:6px">Frame destroyed</div>
        <div style="font-size:13px;color:#6b7280;margin-bottom:20px">
          The DocSpace iframe has been removed from the DOM.
        </div>
        <button class="btn" id="reinitBtn" type="button">Reinitialize Frame</button>
      </div>
    </div>

    <script>
      const destroyBtn   = document.getElementById("destroyBtn");
      const reinitBtn    = document.getElementById("reinitBtn");
      const status       = document.getElementById("status");
      const activeWrap   = document.getElementById("activeWrap");
      const destroyedWrap = document.getElementById("destroyedWrap");

      let docSpace = null;

      function initFrame() {
        // Restore iframe element if previously destroyed
        const wrap = activeWrap.querySelector(".frame-wrap");
        if (!document.getElementById("ds-frame")) {
          const iframe = document.createElement("iframe");
          iframe.id = "ds-frame";
          wrap.appendChild(iframe);
        }

        status.textContent  = "Loading SDK…";
        destroyBtn.disabled = true;

        docSpace = DocSpace.SDK.initManager({
          frameId: "ds-frame",
          width:   "960px",
          height:  "600px",
          theme:   "base",
          events: {
            onAppReady: () => {
              destroyBtn.disabled = false;
              status.textContent  = "Frame is active.";
            },
            onAppError: () => {
              status.textContent = "SDK error — check portal URL";
            }
          }
        });
      }

      destroyBtn.onclick = () => {
        docSpace?.destroyFrame();
        activeWrap.style.display   = "none";
        destroyedWrap.style.display = "";
      };

      reinitBtn.onclick = () => {
        destroyedWrap.style.display = "none";
        activeWrap.style.display   = "";
        initFrame();
      };

      initFrame();
    </script>
  </body>
</html>
