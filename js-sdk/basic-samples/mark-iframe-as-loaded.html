<!--
Example: Mark iframe as loaded

This example demonstrates how to explicitly mark the iframe as loaded using the JavaScript SDK method.

Using methods:
- manager.setIsLoaded (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#setisloaded)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Mark Iframe as Loaded" />
    <meta name="example-description" content="Manually signal that the DocSpace iframe is ready — useful when you control the frame rendering and need to notify the SDK." />
    <meta name="example-group" content="basic" />
    <meta name="example-hidden" content="true" />
    <title>Mark Iframe as Loaded</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-mark-iframe-as-loaded">
    <div class="frame-wrap">
      <iframe id="ds-frame"></iframe>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="btn" type="button">Set Is Loaded</button>
      <span class="status" id="status">Ready</span>
    </div>

    <script>
      const btn = document.getElementById("btn");

      const status = document.getElementById("status");

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-frame",
        width: "960px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => { status.textContent = "Ready"; },
          onAppError: () => { status.textContent = "SDK error — check portal URL"; }
        }
      });

      btn.onclick = async () => {
        try {
          await manager.setIsLoaded();
          status.textContent = "Done";
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
        }
      };
    </script>
  </body>
</html>
