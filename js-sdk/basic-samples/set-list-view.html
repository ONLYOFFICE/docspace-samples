<!--
Example: Set list view

This example demonstrates how to change the file list display mode in DocSpace using the JavaScript SDK.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.setListView (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#setlistview)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Set List View" />
    <meta name="example-description" content="Switch between table and tile views in the embedded DocSpace manager." />
    <meta name="example-group" content="basic" />
    <title>Set List View</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-set-list-view">
    <div class="frame-wrap">
      <iframe id="ds-frame"></iframe>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="btn" type="button">Set list view</button>
      <span class="status" id="status"></span>
    </div>

    <script>
      const btn = document.getElementById("btn");

      const status = document.getElementById("status");

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-frame",
        width: "960px",
        height: "520px",
        theme: "base",
        events: {
          onAppReady: () => { status.textContent = "Ready"; },
          onAppError: () => { status.textContent = "SDK error — check portal URL"; }
        }
      });

      btn.onclick = async () => {
        try {
          await manager.setListView("table");
          status.textContent = "Done";
        } catch (error) {
          status.textContent = "Error: " + (error?.message || String(error));
        }
      };
    </script>
  </body>
</html>
