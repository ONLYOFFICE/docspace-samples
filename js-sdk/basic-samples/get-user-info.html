<!--
Example: Get user info

This example demonstrates how to retrieve user information using the JavaScript SDK embedded in a DocSpace frame.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.getUserInfo (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getuserinfo)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get User Info" />
    <meta name="example-description" content="Retrieve profile information for the currently logged-in DocSpace user." />
    <meta name="example-group" content="basic" />
    <title>Get User Info</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-get-user-info">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <div class="bottom-bar">
          <button class="btn" id="btn" type="button" disabled>Get User Info</button>
          <span class="status" id="hint">Loading…</span>
        </div>
      </div>
      <div class="result-split__panel card">
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="out" readonly placeholder="Result will appear here…"></textarea>
        </div>
      </div>
    </div>

    <script>
const btn = document.getElementById("btn");
const hint = document.getElementById("hint");
const out = document.getElementById("out");

const manager = DocSpace.SDK.initManager({
  frameId: "ds-frame",
  width: "700px",
  height: "520px",
  theme: "base",
  events: {
    onAppReady: () => { btn.disabled = false; hint.textContent = "Ready"; },
    onAppError: () => { hint.textContent = "SDK error — check portal URL"; }
  },
});

btn.onclick = async () => {
  btn.disabled = true;
  hint.textContent = "Loading…";
  out.value = "";

  try {
    const result = await manager.getUserInfo();
    out.value = JSON.stringify(result, null, 2);
    hint.textContent = "Done";
  } catch (error) {
    hint.textContent = "Error";
    out.value = error?.message || String(error);
  } finally {
    btn.disabled = false;
  }
};

    </script>
  </body>
</html>
