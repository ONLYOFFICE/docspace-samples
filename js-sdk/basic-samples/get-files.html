<!--
Example: Get files

This example demonstrates how to retrieve a list of files from a room using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initRoomSelector (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initroomselector)
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.getFiles (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#getfiles)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Get Files" />
    <meta name="example-description" content="Select a room and retrieve the list of files inside it." />
    <meta name="example-group" content="basic" />
    <title>Get Files</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-get-files">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
        <!-- Hidden manager frame for executing SDK methods -->
        <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
          <div id="ds-manager-frame"></div>
        </div>
        <div class="bottom-bar">
          <span class="status" id="hint">Select a room</span>
          <button class="btn" id="getBtn" type="button" disabled>Get Files</button>
        </div>
      </div>
      <div class="result-split__panel card">
        <div class="field">
          <label>Result</label>
          <textarea class="output" id="out" readonly placeholder="Select a room, then click Get Files…"></textarea>
        </div>
        <div id="count" class="count-line"></div>
        <div id="err" class="err-line"></div>
      </div>
    </div>

    <script>
      const getBtn = document.getElementById("getBtn");
      const hint = document.getElementById("hint");
      const out = document.getElementById("out");
      const count = document.getElementById("count");
      const err = document.getElementById("err");

      let roomId = null;
      let manager = null;

      // 1) UI: user selects a room
      DocSpace.SDK.initRoomSelector({
        frameId: "ds-frame",
        width: "700px",
        height: "520px",
        theme: "base",
        events: {
          onSelectCallback: (data) => {
            const item = Array.isArray(data) ? data[0] : data;
            roomId = item?.id ? String(item.id).trim() : null;
            if (!roomId) {
              getBtn.disabled = true;
              hint.textContent = "Select a room";
              err.textContent = "Room ID is missing in selection payload.";
              return;
            }

            err.textContent = "";
            count.textContent = "";
            out.value = "";

            initManagerForRoom(roomId);
          }
        }
      });

      // 2) Background: manager is re-initialized for the selected room context
      function initManagerForRoom(id) {
        getBtn.disabled = true;
        hint.textContent = "Preparing…";

        if (manager && typeof manager.destroyFrame === "function") {
          try { manager.destroyFrame(); } catch {}
        }

        manager = DocSpace.SDK.initManager({
          frameId: "ds-manager-frame",
          width: "0",
          height: "0",
          theme: "base",
          rootPath: "/rooms/shared/" + String(id),
          filter: { folder: String(id) },
          events: {
            onAppReady: () => {
              getBtn.disabled = false;
              hint.textContent = "Ready";
            },
            onAppError: (e) => {
              getBtn.disabled = true;
              hint.textContent = "Error";
              err.textContent = error?.message || "Manager init failed.";
            }
          }
        });
      }

      getBtn.onclick = async () => {
        if (!roomId || !manager) return;

        getBtn.disabled = true;
        hint.textContent = "Loading…";
        err.textContent = "";
        count.textContent = "";
        out.value = "";

        try {
          const files = await manager.getFiles();
          if (!Array.isArray(files)) throw new Error("getFiles() returned non-array data.");
          out.value = JSON.stringify(files, null, 2);
          count.textContent = files.length ? `Found: ${files.length}` : "No files found.";
          hint.textContent = "Done";
        } catch (error) {
          hint.textContent = "Error";
          err.textContent = error?.message || "Failed to load files.";
        } finally {
          getBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
