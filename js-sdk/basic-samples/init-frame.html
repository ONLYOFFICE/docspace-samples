<!--
Example: Initialize frame

This example demonstrates how to initialize the DocSpace view-only frame using the JavaScript SDK method.

Using methods:
- DocSpace.SDK.initFrame (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initframe)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Init Frame" />
    <meta name="example-description" content="Embed a view-only DocSpace frame — browse rooms and files without editing capabilities." />
    <meta name="example-group" content="basic" />
    <title>Init Frame</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-init-frame">
    <div class="result-split">
      <div class="result-split__frame">
        <div class="frame-wrap">
          <iframe id="ds-frame"></iframe>
        </div>
      </div>
      <div class="result-split__panel card" style="flex:0 0 360px;min-height:520px">
        <div class="field">
          <label>SDK Config</label>
          <textarea class="output" id="configOut" readonly></textarea>
        </div>
      </div>
    </div>

    <script>
const config = {
  frameId: "ds-frame",
  width: "700px",
  height: "520px",
  theme: "base"
};

document.getElementById("configOut").value = JSON.stringify(config, null, 2);
DocSpace.SDK.initFrame(config);
    </script>
  </body>
</html>
