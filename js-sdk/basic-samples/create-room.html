<!--
Example: Create room

Create a room by specifying its title, type, and optional tags.

Using methods:
- DocSpace.SDK.initManager (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDK/#initmanager)
- manager.createRoom (https://api.onlyoffice.com/docspace/javascript-sdk/usage-sdk/classes/SDKInstance/#createroom)
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="{PORTAL_SRC}/" />
    <meta charset="UTF-8" />
    <meta name="example-title" content="Create Room" />
    <meta name="example-description" content="Enter a title, choose a room type, add optional tags, and create a new DocSpace room." />
    <meta name="example-group" content="basic" />
    <title>Create Room</title>
    <script src="{PORTAL_SRC}/static/scripts/sdk/2.0.0/api.js"></script>
    <script>
      (function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = new URL("../assets/css/style.css", window.location.href).toString();
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body class="ex-create-room">
    <!-- Hidden manager frame for executing SDK methods -->
    <div style="position:fixed;left:-9999px;top:-9999px;width:0;height:0;overflow:hidden">
      <div id="ds-manager-frame"></div>
    </div>

    <!-- Step 1: form -->
    <div id="formWrap" class="page">
      <div class="card">
        <div class="field">
          <label for="title">Room title</label>
          <input id="title" type="text" value="New Room" autocomplete="off" />
        </div>

        <div class="field">
          <label for="type">Room type</label>
          <select id="type">
            <option value="1">Form filling room</option>
            <option value="2" selected>Collaboration room</option>
            <option value="5">Custom room</option>
            <option value="6">Public room</option>
            <option value="8">Virtual data room</option>
            <option value="9">AI Room</option>
          </select>
        </div>

        <div class="field">
          <label for="tags">Tags <span style="font-weight:400;color:#9ca3af">(comma-separated, optional)</span></label>
          <input id="tags" type="text" placeholder="marketing, q1-2026" />
        </div>

        <div class="actions">
          <button class="btn" id="createBtn" type="button" disabled>Create Room</button>
          <span class="status" id="status">Preparing SDK…</span>
        </div>
      </div>
    </div>

    <!-- Step 2: manager showing the new room -->
    <div id="managerWrap" style="display:none">
      <div class="frame-wrap">
        <iframe id="room-frame"></iframe>
      </div>
      <div class="bottom-bar">
        <button class="btn secondary" onclick="showForm()">← Create another</button>
        <span class="status" id="managerStatus">Opening room…</span>
      </div>
    </div>

    <script>
      const createBtn = document.getElementById("createBtn");
      const status    = document.getElementById("status");

      let sdkReady = false;

      const manager = DocSpace.SDK.initManager({
        frameId: "ds-manager-frame",
        width: "0",
        height: "0",
        theme: "base",
        events: {
          onAppReady: () => {
            sdkReady = true;
            createBtn.disabled = false;
            status.textContent = "SDK ready.";
          },
          onAppError: () => {
            status.textContent = "SDK error — check portal URL";
          }
        }
      });

      function parseTags(input) {
        return (input || "").trim().split(",").map(x => x.trim()).filter(Boolean);
      }

      function showForm() {
        document.getElementById("managerWrap").style.display = "none";
        document.getElementById("formWrap").style.display   = "";
        document.getElementById("title").value = "New Room";
        createBtn.disabled = !sdkReady;
        status.textContent = sdkReady ? "SDK ready." : "Preparing SDK…";
      }

      createBtn.onclick = async () => {
        const title    = (document.getElementById("title").value || "").trim();
        const roomType = Number(document.getElementById("type").value);
        const tags     = parseTags(document.getElementById("tags").value);
        if (!title || !sdkReady) return;

        createBtn.disabled = true;
        status.textContent = "Creating room…";

        try {
          const created = await manager.createRoom(title, roomType, undefined, tags.length ? tags : undefined);
          const roomId  = String(created?.id || "").trim();
          if (!roomId) throw new Error("Room ID is missing in createRoom response.");
          if (typeof window.__demoTrack === "function") {
            window.__demoTrack('room', roomId); // demo only — replace with your own room ID handling
          }

          document.getElementById("formWrap").style.display   = "none";
          document.getElementById("managerWrap").style.display = "";

          DocSpace.SDK.initManager({
            frameId: "room-frame",
            id:      roomId,
            width:   "960px",
            height:  "600px",
            events: {
              onAppReady: () => {
                document.getElementById("managerStatus").textContent =
                  `Room "${title}" created — opened below`;
              },
              onAppError: () => {
                document.getElementById("managerStatus").textContent = "Manager failed to load";
              }
            }
          });
        } catch (error) {
          status.textContent = "Failed: " + (error?.message || String(error));
          createBtn.disabled = false;
        }
      };
    </script>
  </body>
</html>
